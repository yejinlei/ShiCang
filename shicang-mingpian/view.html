/* ===== 详情页 ===== */
:root{--main:#8b2f2f;--ink:#2b2620;--ink2:#5a4f41;--ink3:#8a7554;--rule:#d8c7a6;--seal:#a8322f;}
.topbar{max-width:880px;margin:0 auto;padding:20px 26px 0;display:flex;
  justify-content:space-between;align-items:center;font-size:13px;color:var(--ink3);letter-spacing:.06em;position:relative;z-index:2;}
.topbar .back{border:1px solid var(--main);color:var(--main);padding:3px 14px;border-radius:20px;
  text-decoration:none;transition:.3s;}
.topbar .back:hover{background:var(--main);color:#fff;}
.head{max-width:880px;margin:0 auto;padding:24px 26px 4px;text-align:center;position:relative;z-index:2;}
.head .seal{position:absolute;right:26px;top:30px;width:52px;height:52px;border:2px solid var(--seal);
  color:var(--seal);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'STKaiti',serif;font-size:19px;transform:rotate(-4deg);opacity:.82;}
.head h1{font-family:'STKaiti','KaiTi',serif;font-size:clamp(26px,4.4vw,38px);letter-spacing:.2em;
  text-indent:.2em;color:var(--main);font-weight:600;margin:6px 0 10px;}
.head .sub{font-size:13.5px;color:var(--ink3);letter-spacing:.16em;}
.head .sub .dot{margin:0 8px;opacity:.5;}
.head .from{margin-top:10px;font-size:12.5px;color:#8b5a2b;letter-spacing:.12em;}
.head .from a{color:var(--main);text-decoration:none;border-bottom:1px dashed var(--main);}
.hr{max-width:880px;margin:18px auto 4px;height:0;border-top:1px solid var(--rule);
  border-bottom:3px double var(--rule);position:relative;z-index:2;}
.controls{max-width:880px;margin:8px auto 0;padding:10px 26px 0;display:flex;flex-wrap:wrap;
  gap:9px;justify-content:center;position:relative;z-index:2;}
.sw{border:1px solid var(--rule);background:rgba(255,255,255,.55);color:var(--ink2);
  padding:5px 15px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit;
  letter-spacing:.08em;transition:.26s;user-select:none;}
.sw:hover{border-color:var(--main);color:var(--main);}
.sw.on{background:var(--main);border-color:var(--main);color:#f7f1e3;box-shadow:0 3px 12px -5px var(--main);}
main{max-width:880px;margin:0 auto;padding:22px 26px 60px;position:relative;z-index:2;}
.poem{text-align:center;}
.pline{margin:0 0 16px;}
.chline{display:inline-block;}
.ch{display:inline-block;position:relative;margin:0 3px;}
.ch .zi{font-family:'STKaiti','KaiTi',serif;font-size:25px;color:var(--ink);letter-spacing:.04em;}
.ch .py{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10.5px;
  color:#a08a66;font-family:'Times New Roman',serif;letter-spacing:.02em;opacity:0;transition:.2s;}
.ch .pz{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:10px;
  color:#9a8560;opacity:0;transition:.2s;}
/* 英文翻译 */
.en-lines{margin:28px auto 0;max-width:640px;padding:18px 22px 20px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.3));
  border:1px solid var(--rule);border-radius:8px;opacity:0;max-height:0;overflow:hidden;
  transition:opacity .35s,max-height .4s ease,padding .35s,margin .35s;}
body.opt-en .en-lines{opacity:1;max-height:4000px;padding:18px 22px 20px;margin-top:28px;}
.en-head{font-family:'STKaiti',serif;font-size:15px;color:var(--seal);letter-spacing:.12em;
  text-align:center;padding-bottom:10px;margin-bottom:12px;border-bottom:1px dashed var(--rule);}
.en-head .en-title{display:block;font-family:'Cormorant Garamond','EB Garamond','Times New Roman',serif;
  font-size:18px;font-style:italic;color:var(--ink);letter-spacing:.03em;margin-top:4px;font-weight:600;}
.en-head .en-author{font-size:12.5px;color:var(--ink3);font-family:'Times New Roman',serif;letter-spacing:.08em;margin-top:2px;}
.en-line{font-family:'Cormorant Garamond','EB Garamond','Times New Roman',serif;
  font-size:15px;line-height:1.75;color:#3a3227;text-align:center;letter-spacing:.01em;
  font-style:italic;margin:0 0 6px;}
.en-note{margin-top:14px;padding-top:10px;border-top:1px dashed var(--rule);text-align:center;
  font-size:11.5px;color:#a08a66;letter-spacing:.08em;}
body.opt-py .ch .py{opacity:1;}
body.opt-pz .ch .pz{opacity:1;}
body.opt-py .pline{margin-bottom:26px;}
body.opt-pz .pline{margin-bottom:26px;}
.ch.is-rhyme .zi{color:var(--main);}
body.opt-rhyme .ch.is-rhyme .zi{background:rgba(139,47,47,.09);border-radius:5px;padding:0 2px;}
.ch.is-rhyme .pz{color:var(--main);}
.note-line{margin:26px auto 6px;max-width:620px;font-family:'STKaiti',serif;font-size:14.5px;
  color:#7a6a52;letter-spacing:.06em;border-top:1px dashed var(--rule);padding-top:14px;text-align:center;}
.note-line .lab{color:var(--seal);}
.deepbox{margin:30px auto 0;max-width:620px;text-align:center;}
.deepbox a{display:inline-block;border:1px solid var(--main);color:var(--main);padding:8px 22px;
  border-radius:22px;text-decoration:none;font-size:13.5px;letter-spacing:.1em;transition:.3s;}
.deepbox a:hover{background:var(--main);color:#f7f1e3;}
.pn{max-width:880px;margin:34px auto 0;padding:20px 26px 0;display:flex;justify-content:space-between;
  gap:14px;border-top:1px solid var(--rule);position:relative;z-index:2;}
.pn a{flex:1;text-decoration:none;color:var(--ink2);font-size:13.5px;letter-spacing:.04em;
  border:1px solid #e3d7bd;border-radius:10px;padding:12px 16px;transition:.28s;background:rgba(255,255,255,.5);}
.pn a:hover{border-color:var(--main);color:var(--main);transform:translateY(-2px);}
.pn a span{display:block;font-size:11px;color:#a08a66;letter-spacing:.1em;margin-bottom:3px;}
.pn a.next{text-align:right;}
.pn .ph{flex:1;}
body.vt .chline{writing-mode:vertical-rl;text-orientation:upright;}
body.vt .line-v{display:inline-block;}
body.vt .poem{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;}
body.vt .pline{margin:0 4px;}
body.vt .ch{display:block;margin:5px 0;}
body.vt .ch .py{top:50%;left:auto;right:-14px;transform:translateY(-50%);}
body.vt .ch .pz{bottom:auto;left:-14px;top:50%;transform:translateY(-50%);}
body.vt .en-lines{writing-mode:horizontal-tb;max-width:520px;margin:22px auto 0;}
body.big .ch .zi{font-size:31px;}
body.big .pline{margin-bottom:20px;}
footer{max-width:880px;margin:0 auto;padding:26px;text-align:center;color:#a08a66;

.loading{text-align:center;color:#a08a66;letter-spacing:.3em;padding:70px 0;font-family:'STKaiti',serif;}

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const slug = params.get('s') || '';
const aslug = slug.split('_')[0];
let CHAR = {}, POEMS = [], CUR = null;

const ANTH_SLUG = {qianjiashi:'千家诗',songci300:'宋词三百首',jumiaohaoci:'绝妙好词',
  jin300:'近三百年名家词选',wanshou:'唐人万首绝句选',yuanshi:'元诗别裁集',
  mingshi:'明诗别裁集',qingshi:'清诗别裁集'};

function pick(ch){ return CHAR[ch] || null; }

function renderPoem(p){
  const poem = $('poem');
  const lines = (p.body || []).filter(x => x);
  const PUNC = /[，。！？；：、,.!?;:）)]/;
  // 收集句末字，统计韵部，确定主韵
  const endChars = [];
  lines.forEach(line => {
    const cs = Array.from(line);
    for (let i = 0; i < cs.length - 1; i++){
      if (!PUNC.test(cs[i]) && PUNC.test(cs[i+1])) endChars.push(cs[i]);
    }
  });
  const rc = {};
  endChars.forEach(c => { const inf = pick(c); if (inf && inf.rhyme) rc[inf.rhyme] = (rc[inf.rhyme]||0)+1; });
  let mainRhyme = '', best = 0;
  for (const r in rc){ if (rc[r] > best){ best = rc[r]; mainRhyme = r; } }
  const rhymeOK = c => { const inf = pick(c); return best >= 2 && inf && inf.rhyme && inf.rhyme === mainRhyme; };
  let html = '';
  lines.forEach(line => {
    html += '<div class="pline"><span class="chline">';
    const chars = Array.from(line);
    for (let i = 0; i < chars.length; i++){
      const ch = chars[i];
      if (/[，。！？；：、,.!?;:）)]/.test(ch)){
        html += '<span class="ch"><span class="zi" style="color:#9a8560">' + ch + '</span></span>';
        continue;
      }
      const info = pick(ch) || {};
      const isEnd = i+1 < chars.length && /[，。！？；：、,.!?;:）)]/.test(chars[i+1]);
      const isR = isEnd && rhymeOK(ch);
      html += '<span class="ch' + (isR ? ' is-rhyme' : '') + '">'
        + (info.pinyin ? '<span class="py">' + info.pinyin + '</span>' : '')
        + '<span class="zi">' + ch + '</span>'
        + (info.tone ? '<span class="pz">' + info.tone + '</span>' : '')
        + '</span>';
    }
    html += '</span></div>';
  });
  poem.innerHTML = html;

  // 英译
  const enBox = $('enBox');
  if (p.en_body && p.en_body.some(x => x)){
    enBox.style.display = '';
    $('enTitle').textContent = p.en_title || p.title;
    const au = p.en_author && !/[\u4e00-\u9fff]/.test(p.en_author) ? p.en_author : '';
    $('enAuthor').textContent = (p.en_dynasty||'') + (au ? ' · ' + au : '');
    const elBox = $('enLines');
    elBox.innerHTML = p.en_body.map((e,i) => '<div class="en-line">' + (e||'') + '</div>').join('');
  } else {
    enBox.style.display = 'none';
  }
}

function renderMeta(p){
  $('h1').textContent = p.title + (p.subtitle ? '　' + p.subtitle : '');
  $('sub').innerHTML = p.dynasty + '<span class="dot">·</span>' + p.author
    + '<span class="dot">·</span>' + (p.genre === '词' ? '词' : '诗');
  const anth = ANTH_SLUG[aslug] || p.main_a;
  $('anth-name').textContent = '诗藏 · ' + anth;
  let fromHtml = '选自《' + (p.main_a) + '》';
  if (p.anthologies && p.anthologies.length > 1) fromHtml += '　兼见《' + p.anthologies.slice(1).join('》《') + '》';
  $('from').innerHTML = fromHtml;
  document.getElementById('seal').textContent = p.genre === '词' ? '詞' : '詩';
  if (p.note){
    $('note').style.display = 'block';
    $('note').innerHTML = '<span class="lab">選家評曰　</span>' + p.note;
  }
  if (p.deep){
    $('deepbox').style.display = 'block';
    $('deepbox').innerHTML = '<a href="../shicang-poem/' + p.deep + '.html">展深度精读 · 今译赏析 →</a>';
  }
  document.title = p.title + ' · 名篇集萃 · 诗藏';
}

function renderPN(idx){
  const box = $('pn');
  const prev = POEMS[idx-1], next = POEMS[idx+1];
  let html = '';
  html += prev ? '<a href="view.html?s=' + prev.slug + '"><span>上一篇</span>' + prev.title + '</a>' : '<div class="ph"></div>';
  html += next ? '<a class="next" href="view.html?s=' + next.slug + '"><span>下一篇</span>' + next.title + '</a>' : '<div class="ph"></div>';
  box.innerHTML = html;
}

document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
  b.classList.toggle('on');
  document.body.classList.toggle(b.dataset.opt);
});

Promise.all([
  fetch('../shicang_data/char_info.json').then(r => r.json()).catch(() => ({})),
  fetch('../shicang_data/mingpian/data_' + aslug + '.json').then(r => r.json())
]).then(([chars, poems]) => {
  CHAR = chars; POEMS = poems;
  const idx = poems.findIndex(x => x.slug === slug);
  if (idx < 0){ $('poem').innerHTML = '<div class="loading">未 得 此 篇</div>'; return; }
  CUR = poems[idx];
  renderMeta(CUR);
  renderPoem(CUR);
  renderPN(idx);
});
</script>
