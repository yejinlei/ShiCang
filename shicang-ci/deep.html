<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4efe0;font-family:"Noto Serif SC","STSong",serif;color:#2c1810;min-height:100vh}
.top{max-width:1100px;margin:0 auto;padding:28px;text-align:center;border-bottom:1px solid #d4c5a0}
.top h1{font-size:36px;font-weight:900;letter-spacing:6px}
.top h1 span{color:#8B3A2F;font-family:"Ma Shan Zheng",serif;font-size:40px}
.top .sub{color:#6b5d48;margin-top:10px;font-size:14px;letter-spacing:2px}
.controls{max-width:1100px;margin:0 auto;padding:12px 28px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;border-bottom:1px solid #e4d8c0;background:rgba(255,250,235,.5)}
.controls .chip{padding:6px 14px;border:1px solid #c9b896;border-radius:20px;background:#fdfaf2;cursor:pointer;font-size:13px;color:#6b5d48}
.controls .chip.active{background:#8B3A2F;color:#fdf6e3;border-color:#8B3A2F}
.controls .back{padding:6px 16px;background:#8B3A2F;color:#fdf6e3;border-radius:4px;text-decoration:none;font-size:14px;position:absolute;left:28px}
.content{max-width:1100px;margin:0 auto;padding:32px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-bottom:40px}
.card{background:#fdf6e3;border:1px solid #d4c5a0;border-radius:8px;padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card:hover{box-shadow:0 8px 24px rgba(139,58,47,.15);transform:translateY(-4px);border-color:#c0a878}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:#8B3A2F}
.card .cp{font-size:12px;color:#8B3A2F;letter-spacing:2px;margin-bottom:8px}
.card .tt{font-size:20px;font-weight:900;color:#2c1810;margin-bottom:4px;font-family:"Ma Shan Zheng",serif}
.card .au{font-size:13px;color:#6b5d48;margin-bottom:10px}
.card .pv{font-size:12px;color:#8a7560;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.7}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,24,16,.75);z-index:100;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#f6efe0;border:2px solid #c9a878;border-radius:8px;max-width:820px;width:100%;padding:40px 48px;position:relative;margin-bottom:40px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .seal{position:absolute;top:16px;right:20px;width:56px;height:56px;background:#8B3A2F;color:#fdf6e3;font-family:"Ma Shan Zheng",serif;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:4px;writing-mode:vertical-rl;letter-spacing:4px}
.modal h2{font-size:32px;color:#2c1810;margin-bottom:4px;letter-spacing:2px;font-family:"Ma Shan Zheng",serif}
.modal .cp-line{font-size:14px;color:#8B3A2F;margin-bottom:6px}
.modal .au-line{font-size:14px;color:#6b5d48;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #d4c5a0}
.modal .poem-body{font-size:22px;line-height:2.4;letter-spacing:3px;color:#2c1810;text-align:center;margin:20px 0;padding:24px 0;border-top:1px dashed #d4c5a0;border-bottom:1px dashed #d4c5a0}
.modal .bg{background:#fdf6e3;border-left:3px solid #c9a878;padding:14px 18px;margin:20px 0;font-size:14px;line-height:1.9;color:#4a3828}
.modal .bg b{color:#8B3A2F}
.modal .sec{margin-top:28px}
.modal .sec h4{color:#8B3A2F;font-size:17px;margin-bottom:12px;letter-spacing:2px;padding-bottom:8px;border-bottom:1px solid #e4d8c0}
.modal .sec .row{display:grid;grid-template-columns:80px 1fr;gap:16px;margin-bottom:12px;line-height:1.9}
.modal .sec .row .tag{color:#8B3A2F;font-weight:600;font-size:14px}
.modal .sec .row .body{color:#3c2818;font-size:15px}
.modal .sec .vernacular p{font-size:15px;line-height:2;color:#3c2818;margin-bottom:8px;text-indent:2em}
.modal .sec .english{background:#f0e8d0;padding:14px 18px;border-radius:4px;font-style:italic;color:#4a3828;font-size:14px;line-height:1.8}
.close{position:absolute;top:16px;right:90px;background:none;border:none;font-size:28px;cursor:pointer;color:#8B3A2F;z-index:10}
@media(max-width:768px){.modal{padding:24px}.modal h2{font-size:24px}.modal .poem-body{font-size:18px}.seal{width:40px;height:40px;font-size:20px}}
</style>

<div class="top">
  <a href="index.html" class="back">← 词林</a>
  <h1>名<span>词</span>精读</h1>
  <div class="sub">二十首经典词作 · 今译英译 · 起承转合 · 历代赏析</div>
</div>
<div class="controls" id="themeBar"></div>
<div class="content">
  <div class="grid" id="grid"></div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <div class="seal">词<br>品</div>
    <div id="mc"></div>
  </div>
</div>
<script src="deep_ci.js"></script>
<script>
const works=DEEP_CI.works;
const themes=[...new Set(works.map(w=>w.theme))];
let curTheme='all';
const themeColors={'豪放壮阔':'#C0392B','恬淡闲适':'#27AE60','深情婉约':'#8E44AD','悲慨沉郁':'#7F8C8D','慷慨爱国':'#D35400','旷达超脱':'#2980B9','怀古沧桑':'#795548','清雅禅意':'#607D8B'};

function renderThemes(){
  let h='<div class="chip '+(curTheme==='all'?'active':'')+'" onclick="st(\'all\')">全部 20</div>';
  themes.forEach(t=>{h+='<div class="chip '+(curTheme===t?'active':'')+'" onclick="st(\''+t+'\')" style="'+(curTheme===t?'background:'+themeColors[t]+';border-color:'+themeColors[t]+';color:#fff':'')+'">'+t+'</div>'});
  document.getElementById('themeBar').innerHTML=h;
}
function st(t){curTheme=t;renderThemes();render();}
function render(){
  const list=curTheme==='all'?works:works.filter(w=>w.theme===curTheme);
  let h='';
  list.forEach((w,i)=>{
    const realIdx=works.indexOf(w);
    const firstLine=w.text.split(/[，。；！？]/)[0];
    h+='<div class="card" onclick="openD('+realIdx+')" style="border-top-color:'+(themeColors[w.theme]||'#8B3A2F')+'">'
      +'<div class="cp">'+w.cipai+' · '+w.dynasty+'</div>'
      +'<div class="tt">'+w.title+'</div>'
      +'<div class="au">'+w.author+'</div>'
      +'<div class="pv">'+firstLine+'...</div>'
      +'</div>';
  });
  document.getElementById('grid').innerHTML=h;
}
function openD(i){
  const w=works[i];
  let structH='';
  w.structure.forEach(s=>{structH+='<div class="row"><div class="tag">'+s[0]+'</div><div class="body">'+s[1]+'</div></div>'});
  const vernH = w.vernacular.split('\n\n').map(p=>'<p>'+p.replace(/【今译】/g,'')+'</p>').join('');
  const h='<h2>'+w.title+'</h2>'+
    '<div class="cp-line">【'+w.cipai+'】· '+w.author+' · '+w.dynasty+' · '+w.year+'</div>'+
    '<div class="au-line">情境主题：'+w.theme+'</div>'+
    '<div class="poem-body">'+w.text.replace(/，/g,'，<br>').replace(/。/g,'。<br>').replace(/\?/g,'？<br>')+'</div>'+
    '<div class="bg"><b>【创作背景】</b>'+w.background+'</div>'+
    '<div class="sec"><h4>起承转合</h4>'+structH+'</div>'+
    '<div class="sec"><h4>白话今译</h4><div class="vernacular">'+vernH+'</div></div>'+
    '<div class="sec"><h4>英译 English Translation</h4><div class="english">'+w.english.replace(/\n/g,'<br>')+'</div></div>'+
    '<div class="sec"><h4>评析</h4><div class="row"><div class="body" style="grid-column:1/-1;font-size:15px;line-height:2;color:#3c2818">'+w.appreciation+'</div></div></div>';
  document.getElementById('mc').innerHTML=h;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal').scrollTop=0;
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderThemes();render();
</script>
</body>
