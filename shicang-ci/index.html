<style>
:root{
  --paper:#f6efe0; --paper2:#fbf7ec; --ink:#2b2318; --ink2:#5c5346;
  --zhu:#8b3a2f; --zhu2:#b5503f; --line:#d9cbb1; --gold:#a8862f; --lanc:#3f6680;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.9;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(180,150,100,.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(140,110,70,.05), transparent 45%);
}
a{color:var(--zhu);text-decoration:none}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(246,239,224,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
header.top .back{font-size:14px;color:var(--ink2)}
header.top h1{font-size:20px;margin:0;letter-spacing:.18em;color:var(--zhu);font-weight:600}
header.top .sub{font-size:12.5px;color:var(--ink2);letter-spacing:.05em}
header.top .spacer{flex:1}
header.top .stat{font-size:12.5px;color:var(--ink2)}
.layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 56px)}
aside.books{
  width:260px;flex:0 0 260px;border-right:1px solid var(--line);
  height:calc(100vh - 56px);overflow:auto;padding:12px 8px 40px;
  position:sticky;top:56px;
}
aside.books .cat{font-size:12px;color:var(--gold);letter-spacing:.2em;margin:12px 8px 6px}
aside.books .bk{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink2)}
aside.books .bk:hover{background:rgba(63,102,128,.07)}
aside.books .bk.on{background:rgba(63,102,128,.12);color:var(--lanc);font-weight:600}
aside.books .bk .n{font-size:11.5px;color:#9a8f7c}
main.body{flex:1;min-width:0;padding:16px 26px 80px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--line);border-radius:22px;background:var(--paper2);font-family:inherit;font-size:14px;color:var(--ink);outline:none}
.tools input:focus{border-color:var(--lanc)}
.tools .hint{font-size:12.5px;color:#9a8f7c}
.tools .cp-filter{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px}
.tools .cp-tag{padding:3px 10px;border:1px solid var(--line);border-radius:14px;font-size:12px;cursor:pointer;color:var(--ink2);background:var(--paper2)}
.tools .cp-tag.on{background:var(--lanc);color:#fff;border-color:var(--lanc)}
.bookhead{margin:6px 0 14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.bookhead h2{margin:0 0 4px;font-size:22px;color:var(--lanc);letter-spacing:.08em}
.bookhead .m{font-size:13px;color:var(--ink2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:10px 14px;cursor:pointer;transition:.18s}
.card:hover{border-color:var(--lanc);box-shadow:0 3px 12px rgba(63,102,128,.12)}
.card .ct{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.card .cl{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cg{font-size:11.5px;color:var(--gold);margin-top:3px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:18px 0;font-size:13.5px;color:var(--ink2)}
.pager button{border:1px solid var(--line);background:var(--paper2);border-radius:18px;padding:5px 14px;font-family:inherit;cursor:pointer;color:var(--ink2)}
.pager button:disabled{opacity:.4;cursor:default}
.veil{position:fixed;inset:0;background:rgba(30,24,16,.45);display:none;z-index:40}
.veil.on{display:block}
.reader{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:min(780px,94vw);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid #c9b898;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:26px 30px 34px;display:none}
.reader.on{display:block}
.reader .rh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.reader .rh h3{margin:0;font-size:22px;color:var(--lanc);letter-spacing:.08em}
.reader .rh .meta{font-size:12.5px;color:var(--ink2)}
.reader .rh .x{margin-left:auto;cursor:pointer;color:var(--ink2);font-size:22px;line-height:1}
.poem{margin:6px 0 14px}
.slab-title{text-align:center;font-size:13px;color:var(--lanc);letter-spacing:.5em;margin:12px 0 6px}
.pl{white-space:nowrap;margin:0 0 2px;text-align:center}
.ch{display:inline-block;position:relative;padding:16px 3px 16px;font-size:24px;line-height:1.2}
.ch .py{position:absolute;top:0;left:0;right:0;font-size:10.5px;color:#8a7f6a;font-family:system-ui,sans-serif;text-align:center;letter-spacing:0}
.ch .pz{position:absolute;bottom:0;left:0;right:0;font-size:10.5px;color:#a89878;text-align:center}
.ch.rh .zi{color:var(--lanc);font-weight:600}
.ch.rh::after{content:"";position:absolute;left:50%;bottom:2px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--lanc);opacity:.7}
.ch .zi{position:relative}
.ch.ru .zi{color:#9c5a2e;border-bottom:1px dotted #c47848}
.info{background:rgba(63,102,128,.06);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--ink2);margin-bottom:12px;line-height:1.8}
.info b{color:var(--lanc)}
.segs{font-size:12.5px;color:#8a7f6a;text-align:center;letter-spacing:.05em}
.nores{color:#9a8f7c;font-size:14px;padding:30px 0;text-align:center}
@media(max-width:820px){
  aside.books{display:none}
  main.body{padding:14px 14px 60px}
  .ch{font-size:20px;padding:14px 2px}
}
</style>

<script src="../shicang-jingdu/chartab.js"></script>
<script src="ci_data.js"></script>
<script>
const DATA=window.CI_DATA;
const BOOKS=DATA.books, WORKS=DATA.works, CILIN=DATA.cilin;
let CUR=null, FILTERED=[], PAGE=1, PER=36, CP_FILTER="";
const TAB=window.SC_CHARTAB||{};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// 基于chartab+PYDATA做兜底拼音平仄
function getChInfo(ch){
  // chartab: "py|pz|韵"
  if(TAB[ch]){const [py,pz]=TAB[ch].split("|");return {py,pz};}
  return {py:"",pz:"?"};
}

function charHtml(c){
  const info=getChInfo(c.c);
  const isRhyme=c.rhyme, isRu=c.ru;
  let cls="ch";
  if(isRhyme) cls+=" rh";
  if(isRu) cls+=" ru";
  return `<span class="${cls}"><span class="py">${esc(info.py||c.py||"")}</span>`+
         `<span class="zi">${esc(c.c)}</span>`+
         `<span class="pz">${esc(info.pz||c.pz||"")}</span></span>`;
}

function renderWork(w){
  let poem="";
  w.slabs.forEach((slab,si)=>{
    poem+=`<div class="slab-title">· ${w.slab_names[si]} ·</div>`;
    slab.forEach(ln=>{
      let inner="";
      ln.forEach(c=>inner+=charHtml(c));
      poem+=`<div class="pl">${inner}</div>`;
    });
  });
  const totalCh=w.lines.reduce((a,b)=>a+b.length,0);
  return `
    <div class="rh">
      <h3>${esc(w.cipai)}${w.sub_title?" · "+esc(w.sub_title):""}</h3>
      <span class="meta">${w.meter_type||"词"} · ${totalCh}字 · 词林正韵：<b>${esc(w.rhyme_bu||"—")}</b> · 出自《${esc(w.book)}》</span>
      <span class="x" onclick="closeReader()">×</span>
    </div>
    <div class="info">
      <div><b>格律</b>：${w.meter_type||"双调"} · ${w.slabs.length}片 · ${w.lines.length}句</div>
      <div><b>韵部</b>：词林正韵 ${esc(w.rhyme_bu||"—")}　<b>韵脚</b>：${w.rhyme_chars.map(esc).join("　")||"—"}</div>
      <div><b>图例</b>：朱色字为<b style="color:var(--lanc)">韵脚</b>（下有蓝圈）；赭色点下划线为<b style="color:#9c5a2e">入声字</b>；上方拼音，下方平仄。</div>
    </div>
    <div class="poem">${poem}</div>
    <div class="segs">${esc(w.cipai)} · 格律校验匹配度 ${Math.round(w.score*100)}% · 词林正韵十九部</div>
  `;
}

function openWork(i){
  const w=FILTERED[i];
  document.getElementById("reader").innerHTML=renderWork(w);
  document.getElementById("reader").classList.add("on");
  document.getElementById("veil").classList.add("on");
}
function closeReader(){
  document.getElementById("reader").classList.remove("on");
  document.getElementById("veil").classList.remove("on");
}
document.getElementById("veil").onclick=closeReader;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeReader();});

function preview(w){
  // 取第一片前两句
  let first=[];
  if(w.slabs[0]){
    for(const ln of w.slabs[0]){
      first.push(ln.map(c=>c.c).join(""));
      if(first.length>=2)break;
    }
  }
  return first.join("，")+"…";
}

function renderList(){
  const el=document.getElementById("list");
  const total=FILTERED.length, pages=Math.max(1,Math.ceil(total/PER));
  if(PAGE>pages)PAGE=pages;
  const st=(PAGE-1)*PER, seg=FILTERED.slice(st,st+PER);
  if(!seg.length){el.innerHTML='<div class="nores">未找到匹配的词作</div>';}
  else{
    el.innerHTML=seg.map((w,k)=>{
      const i=st+k;
      return `<div class="card" onclick="openWork(${i})">
        <div class="ct">${esc(w.cipai)}${w.sub_title?" · "+esc(w.sub_title):""}</div>
        <div class="cl">${esc(preview(w))}</div>
        <div class="cg">${w.meter_type||"词"} · 词林正韵 ${esc(w.rhyme_bu||"—")} · 《${esc(w.book)}》</div>
      </div>`;
    }).join("");
  }
  const pg=document.getElementById("pager");
  pg.innerHTML=`<button ${PAGE<=1?"disabled":""} onclick="go(${PAGE-1})">上一页</button>
    <span>第 ${PAGE} / ${pages} 页　共 ${total} 首</span>
    <button ${PAGE>=pages?"disabled":""} onclick="go(${PAGE+1})">下一页</button>`;
}
function go(p){PAGE=p;renderList();window.scrollTo({top:0,behavior:"smooth"});}

function applyFilter(){
  const q=document.getElementById("q").value.trim();
  let ws = WORKS.slice();
  if(CP_FILTER) ws = ws.filter(w=>w.cipai===CP_FILTER);
  if(q){
    ws=ws.filter(w=>{
      const all = w.cipai+" "+(w.sub_title||"")+" "+w.book+" "+w.lines.join("");
      return all.includes(q);
    });
  }
  FILTERED=ws;
  PAGE=1;
  document.getElementById("qhint").textContent=q||CP_FILTER?`命中 ${FILTERED.length} 首`:"";
  renderList();
}
document.getElementById("q").addEventListener("input",()=>{
  clearTimeout(window._t);window._t=setTimeout(applyFilter,180);
});

function openBook(bookId){
  document.querySelectorAll("aside .bk").forEach(x=>{
    x.classList.toggle("on",x.dataset.id===bookId);
  });
  if(bookId==="__all__"){
    CUR="__all__";
    document.getElementById("bhead").innerHTML=
      `<h2>全部词集</h2><div class="m">136 部词集 · 共 ${WORKS.length} 首精读</div>`;
  }else{
    const b=BOOKS.find(x=>x.id===bookId);CUR=bookId;
    document.getElementById("bhead").innerHTML=
      `<h2>${esc(b.title)}</h2><div class="m">词集 · 共 ${b.count} 首精读</div>`;
  }
  CP_FILTER="";renderCpFilter();
  document.getElementById("q").value="";applyFilter();
}

function renderCpFilter(){
  // 当前集内词牌列表
  const pool = CUR==="__all__" ? WORKS : WORKS.filter(w=>{
    const b=BOOKS.find(x=>x.id===CUR);return b && w.book===b.title;
  });
  const cpCount={};
  pool.forEach(w=>cpCount[w.cipai]=(cpCount[w.cipai]||0)+1);
  const cps=Object.entries(cpCount).sort((a,b)=>b[1]-a[1]);
  const el=document.getElementById("cpfilter");
  let html=`<span class="cp-tag ${CP_FILTER===""?"on":""}" onclick="setCp('')">全部词牌</span>`;
  cps.forEach(([cp,n])=>{
    html+=`<span class="cp-tag ${CP_FILTER===cp?"on":""}" onclick="setCp('${esc(cp)}')">${esc(cp)} ${n}</span>`;
  });
  el.innerHTML=html;
}
function setCp(cp){CP_FILTER=cp;applyFilter();renderCpFilter();}

function init(){
  document.getElementById("stat").textContent=`${BOOKS.length} 部词集 · ${WORKS.length.toLocaleString()} 首词精读`;
  const aside=document.getElementById("booklist");
  let html=`<div class="cat">全部词集</div>`;
  html+=`<div class="bk on" data-id="__all__" onclick="openBook('__all__')"><span>全部</span><span class="n">${WORKS.length}</span></div>`;
  html+=`<div class="cat">词集 · ${BOOKS.length}部</div>`;
  BOOKS.forEach(b=>{
    html+=`<div class="bk" data-id="${b.id}" onclick="openBook('${b.id}')">
      <span>${esc(b.title)}</span><span class="n">${b.count}</span></div>`;
  });
  aside.innerHTML=html;
  openBook("__all__");
}
init();
</script>

<div class="idle-seal" onclick="togglePetals()" title="点此开/关落花">閑章</div>
<div class="colophon">诗藏本体论 · 岁在丙午 · 辑于西泠</div>
<script>
window.addEventListener('scroll', ()=>{
  const btn = document.getElementById('backToTop');
  if(btn) btn.classList.toggle('show', window.scrollY>300);
});
document.addEventListener('click', (e)=>{
  if(e.target.id === 'backToTop') window.scrollTo({top:0,behavior:'smooth'});
});
let petalsOn = localStorage.getItem('petals')==='true';
let petalTimer = null;
function togglePetals(){
  petalsOn = !petalsOn;
  localStorage.setItem('petals', petalsOn);
  petalsOn ? startPetals() : stopPetals();
}
function startPetals(){
  if(petalTimer) return;
  petalTimer = setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*7) + 's';
    const s = 6 + Math.random()*8;
    p.style.width = p.style.height = s + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 15000);
  }, 700);
}
function stopPetals(){
  clearInterval(petalTimer);
  petalTimer = null;
}
if(petalsOn) startPetals();
// 夜读模式兼容
document.querySelectorAll('.night-btn, [onclick*="night"]').forEach(btn=>{
  btn.addEventListener('click', ()=>document.body.classList.toggle('night'));
});
// 卷轴入场
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelector('.container, .main, .content')?.classList.add('scroll-unfold');
});
</script>
