          <p>春风送暖入屠苏。</p>

<script>

const festivals = {

  "12-25": "圣诞节"
};

// 农历节日（简化，按常见对应公历近似）
const lunarFestivals = {
  "1-1": "春节",
  "1-15": "元宵节",
  "2-2": "龙抬头",
  "5-5": "端午节",
  "7-7": "七夕节",
  "7-15": "中元节",
  "8-15": "中秋节",
  "9-9": "重阳节",
  "12-8": "腊八节",
  "12-23": "小年",
  "12-30": "除夕"
};

// 四季诗词库（按月份/节气/节日匹配）
const poemDB = [
  // 1月·岁首
  {month: [1], term: ["元旦", "春节", "小寒", "大寒"], title: "元日", author: "宋 · 王安石",
   content: ["爆竹声中一岁除，", "春风送暖入屠苏。", "千门万户曈曈日，", "总把新桃换旧符。"],
   appreciation: "以“爆竹声中一岁除”开篇，写辞旧迎新的欢腾；春风送暖、屠苏酒，处处是新岁气象。末句“总把新桃换旧符”既写换桃符的年俗，又暗寓除旧布新的抱负，语带双关，是咏新年诗中的名篇。", theme: "冬·岁首迎新"},
  {month: [1], term: ["元旦", "春节", "小寒", "大寒"], title: "梅花", author: "宋 · 王安石",
   content: ["墙角数枝梅，", "凌寒独自开。", "遥知不是雪，", "为有暗香来。"],
   appreciation: "以墙角数枝梅起笔，“凌寒独自开”写其傲寒独放；后两句借雪设疑、以香辨梅，妙在“遥知不是雪，为有暗香来”——以雪比梅之白，以香别梅之真，托物言志，赞颂身处逆境仍守高洁的品格。", theme: "冬·岁首迎新"},
  {month: [1], term: ["元旦", "春节", "小寒", "大寒"], title: "除夜作", author: "唐 · 高适",
   content: ["旅馆寒灯独不眠，", "客心何事转凄然。", "故乡今夜思千里，", "霜鬓明朝又一年。"],
   appreciation: "客中逢除夕，寒灯独坐，“客心何事转凄然”一问自照；末联“故乡今夜思千里，霜鬓明朝又一年”从对面着笔写家人念远，又将岁末添岁之慨并入，羁旅之悲与流光之叹交织。", theme: "冬·岁首迎新"},
  {month: [1], term: ["元旦", "春节", "小寒", "大寒"], title: "逢雪宿芙蓉山主人", author: "唐 · 刘长卿",
   content: ["日暮苍山远，", "天寒白屋贫。", "柴门闻犬吠，", "风雪夜归人。"],
   appreciation: "日暮苍山远，天寒白屋贫，写投宿所见；后两句柴门犬吠、风雪夜归，由静入动，以白描勾勒山居寒夜图，“风雪夜归人”一句冷中见暖，苍茫中透出人间气息。", theme: "冬·岁首迎新"},
  // 2月·早春
  {month: [2], term: ["立春", "雨水", "元宵"], title: "春夜喜雨", author: "唐 · 杜甫",
   content: ["好雨知时节，", "当春乃发生。", "随风潜入夜，", "润物细无声。", "野径云俱黑，", "江船火独明。", "晓看红湿处，", "花重锦官城。"],
   appreciation: "通篇不着“喜”字却处处见喜。“好雨知时节”写雨之善解人意，“潜”“细”二字状其润物无声；尾联悬想天明锦官城花团锦簇，以虚写实，把一夜春雨的喜悦推到极处。", theme: "春·早春初萌"},
  {month: [2], term: ["立春", "雨水", "元宵"], title: "咏柳", author: "唐 · 贺知章",
   content: ["碧玉妆成一树高，", "万条垂下绿丝绦。", "不知细叶谁裁出，", "二月春风似剪刀。"],
   appreciation: "前两句以碧玉喻柳树、以绿丝绦喻柳条，化静为动；后两句“不知细叶谁裁出，二月春风似剪刀”以问答收束，将无形春风想象成能裁剪的巧手，比喻新奇，咏物而见春之生意。", theme: "春·早春初萌"},
  {month: [2], term: ["立春", "雨水", "元宵"], title: "城东早春", author: "唐 · 杨巨源",
   content: ["诗家清景在新春，", "绿柳才黄半未匀。", "若待上林花似锦，", "出门俱是看花人。"],
   appreciation: "以“诗家清景在新春”立论，绿柳初黄、尚未匀色，写早春之新嫩；末句以“若待上林花似锦，出门俱是看花人”反衬，赞早春清景之独得，识见有别于常人。", theme: "春·早春初萌"},
  {month: [2], term: ["立春", "雨水", "元宵"], title: "早春呈水部张十八员外", author: "唐 · 韩愈",
   content: ["天街小雨润如酥，", "草色遥看近却无。", "最是一年春好处，", "绝胜烟柳满皇都。"],
   appreciation: "“天街小雨润如酥”写初春细雨之细腻，“草色遥看近却无”捕捉草芽将萌、若有若无的早春神韵；末联断言早春胜于烟柳满城，识见独到，道出“生意初萌”之美。", theme: "春·早春初萌"},
  // 3月·仲春
  {month: [3], term: ["惊蛰", "春分"], title: "春晓", author: "唐 · 孟浩然",
   content: ["春眠不觉晓，", "处处闻啼鸟。", "夜来风雨声，", "花落知多少。"],
   appreciation: "从春睡初醒写起，以处处鸟啼、夜来风雨、花落多少串起晨间所闻所想；全篇不写所见而写所感，由听觉牵出惜春之情，语言平易自然，余味悠长。", theme: "春·仲春踏青"},
  {month: [3], term: ["惊蛰", "春分"], title: "钱塘湖春行", author: "唐 · 白居易",
   content: ["孤山寺北贾亭西，", "水面初平云脚低。", "几处早莺争暖树，", "谁家新燕啄春泥。", "乱花渐欲迷人眼，", "浅草才能没马蹄。", "最爱湖东行不足，", "绿杨阴里白沙堤。"],
   appreciation: "以“行”为线索移步换景：孤山寺北、水面初平，早莺争树、新燕啄泥，乱花浅草次第入目。“渐欲”“才能”写出早春初生未盛之态，末句最爱湖东白堤，收束明快。", theme: "春·仲春踏青"},
  {month: [3], term: ["惊蛰", "春分"], title: "惠崇春江晚景", author: "宋 · 苏轼",
   content: ["竹外桃花三两枝，", "春江水暖鸭先知。", "蒌蒿满地芦芽短，", "正是河豚欲上时。"],
   appreciation: "为画题咏而能由画面生发联想。“春江水暖鸭先知”以鸭感水暖写早春先知，末句转入河豚欲上，把眼前静态的春江晚景延展到画外，虚实相生。", theme: "春·仲春踏青"},
  {month: [3], term: ["惊蛰", "春分"], title: "江南春", author: "唐 · 杜牧",
   content: ["千里莺啼绿映红，", "水村山郭酒旗风。", "南朝四百八十寺，", "多少楼台烟雨中。"],
   appreciation: "千里莺啼、绿映红、水村山郭、酒旗风，写江南春景的繁丽；后两句转出“南朝四百八十寺，多少楼台烟雨中”，由眼前春色牵出历史兴亡之感，明丽中含苍茫。", theme: "春·仲春踏青"},
  // 4月·暮春
  {month: [4], term: ["清明", "谷雨"], title: "大林寺桃花", author: "唐 · 白居易",
   content: ["人间四月芳菲尽，", "山寺桃花始盛开。", "长恨春归无觅处，", "不知转入此中来。"],
   appreciation: "山寺桃花与“人间四月芳菲尽”形成对照，“始盛开”三字点出山高地寒、花开较迟的物候之理；于寻春不遇之际忽逢盛景，惊喜之情溢于言表。", theme: "春·暮春惜春"},
  {month: [4], term: ["清明", "谷雨"], title: "寒食", author: "唐 · 韩翃",
   content: ["春城无处不飞花，", "寒食东风御柳斜。", "日暮汉宫传蜡烛，", "轻烟散入五侯家。"],
   appreciation: "春城飞花、东风御柳，写寒食节长安春色；“日暮汉宫传蜡烛，轻烟散入五侯家”写寒食赐火之制，以汉喻唐，暗讽权贵蒙恩，笔致含蓄，寓意深远。", theme: "春·暮春惜春"},
  {month: [4], term: ["清明", "谷雨"], title: "题都城南庄", author: "唐 · 崔护",
   content: ["去年今日此门中，", "人面桃花相映红。", "人面不知何处去，", "桃花依旧笑春风。"],
   appreciation: "以“去年今日”与“人面桃花”对起，同门同花而人已不见，唯余桃花依旧笑对春风；一“笑”字反衬出物是人非的怅惘，叙事简净而含情不尽。", theme: "春·暮春惜春"},
  {month: [4], term: ["清明", "谷雨"], title: "晚春", author: "唐 · 韩愈",
   content: ["草树知春不久归，", "百般红紫斗芳菲。", "杨花榆荚无才思，", "惟解漫天作雪飞。"],
   appreciation: "草木知春将归而竞相斗艳，是拟人写法；杨花榆荚“无才思”，惟解漫天作雪飞，一反惜春的伤感，以戏谑之笔写晚春的热闹，别开生面。", theme: "春·暮春惜春"},
  // 5月·初夏
  {month: [5], term: ["立夏", "小满", "端午"], title: "小池", author: "宋 · 杨万里",
   content: ["泉眼无声惜细流，", "树阴照水爱晴柔。", "小荷才露尖尖角，", "早有蜻蜓立上头。"],
   appreciation: "写泉眼、树阴、小荷、蜻蜓，一“惜”一“爱”将泉与树拟人；末句“早有蜻蜓立上头”定格细景，以小巧之物写初夏初生的清新生意。", theme: "夏·初夏清和"},
  {month: [5], term: ["立夏", "小满", "端午"], title: "山亭夏日", author: "唐 · 高骈",
   content: ["绿树阴浓夏日长，", "楼台倒影入池塘。", "水晶帘动微风起，", "满架蔷薇一院香。"],
   appreciation: "绿树阴浓、楼台倒影、水晶帘动、满架蔷薇，前两句写静景，后两句由风动帘、香满院写动态；末句以嗅觉收束，写尽夏日庭院清幽凉爽。", theme: "夏·初夏清和"},
  {month: [5], term: ["立夏", "小满", "端午"], title: "三衢道中", author: "宋 · 曾几",
   content: ["梅子黄时日日晴，", "小溪泛尽却山行。", "绿阴不减来时路，", "添得黄鹂四五声。"],
   appreciation: "梅子黄时、日日晴，小溪泛尽又改山行，记出游的行程；“绿阴不减来时路，添得黄鹂四五声”以声衬静，写出初夏山行的轻快愉悦，声色兼备。", theme: "夏·初夏清和"},
  {month: [5], term: ["立夏", "小满", "端午"], title: "夏意", author: "宋 · 苏舜钦",
   content: ["别院深深夏簟清，", "石榴开遍透帘明。", "树阴满地日当午，", "梦觉流莺时一声。"],
   appreciation: "别院深深、夏簟清凉、石榴开遍、树阴满地，层层铺写幽静之境以消暑；末句“流莺时一声”以声衬静，写出夏日午后的闲适安宁。", theme: "夏·初夏清和"},
  // 6月·盛夏
  {month: [6], term: ["芒种", "夏至"], title: "题西林壁", author: "宋 · 苏轼",
   content: ["横看成岭侧成峰，", "远近高低总不同。", "不识庐山真面目，", "只缘身在此山中。"],
   appreciation: "前两句写横看侧看、远近高低，山形各异；后两句由观山悟理——不识庐山真面目，只因身在山中。即景说理，理趣深远，写景与哲思浑然一体。", theme: "夏·盛夏日长"},
  {month: [6], term: ["芒种", "夏至"], title: "六月二十七日望湖楼醉书", author: "宋 · 苏轼",
   content: ["黑云翻墨未遮山，", "白雨跳珠乱入船。", "卷地风来忽吹散，", "望湖楼下水如天。"],
   appreciation: "二十八字写一场骤雨来去：黑云翻墨、白雨跳珠、卷地风来、水如天光。色彩明暗交替，节奏跌宕，把夏日西湖风雨的急骤与放晴写得如在目前。", theme: "夏·盛夏日长"},
  {month: [6], term: ["芒种", "夏至"], title: "饮湖上初晴后雨", author: "宋 · 苏轼",
   content: ["水光潋滟晴方好，", "山色空蒙雨亦奇。", "欲把西湖比西子，", "淡妆浓抹总相宜。"],
   appreciation: "晴时水光潋滟，雨中山色空蒙，一晴一雨各见其妙；末句“欲把西湖比西子，淡妆浓抹总相宜”以西子喻西湖，化实为虚，成咏西湖的千古名句。", theme: "夏·盛夏日长"},
  // 7月·消夏
  {month: [7], term: ["小暑", "大暑", "七夕"], title: "秋夕", author: "唐 · 杜牧",
   content: ["红烛秋光冷画屏，", "轻罗小扇扑流萤。", "天阶夜色凉如水，", "坐看牵牛织女星。"],
   appreciation: "银烛秋光、画屏、轻罗小扇扑流萤，写秋夜宫女的孤寂；卧看牵牛织女星，以天上团圆反衬人间寂寞，含蓄凄美，是宫怨诗的名作。", theme: "夏·消夏纳凉"},
  {month: [7], term: ["小暑", "大暑", "七夕"], title: "乞巧", author: "唐 · 林杰",
   content: ["七夕今宵看碧霄，", "牵牛织女渡河桥。", "家家乞巧望秋月，", "穿尽红丝几万条。"],
   appreciation: "七夕仰望碧霄，写牛郎织女渡河相会，又写家家户户穿针乞巧。以天上传说映人间习俗，语浅而意趣盎然，写出节日里的天真祈愿。", theme: "夏·消夏纳凉"},
  {month: [7], term: ["小暑", "大暑", "七夕"], title: "纳凉", author: "宋 · 秦观",
   content: ["携杖来追柳外凉，", "画桥南畔倚胡床。", "月明船笛参差起，", "风定池莲自在香。"],
   appreciation: "携杖追凉、画桥倚床写纳凉之态，月明船笛、风定池莲写夜境清幽；由动入静，末句“风定池莲自在香”以莲香透出凉意，闲适可味。", theme: "夏·消夏纳凉"},
  {month: [7], term: ["小暑", "大暑", "七夕"], title: "夏日绝句", author: "宋 · 李清照",
   content: ["生当为人杰，", "死亦作鬼雄。", "至今思项羽，", "不肯过江东。"],
   appreciation: "以“人杰”“鬼雄”立论，借项羽不肯过江东的典故发议。二十字铿锵有力，气骨凛然，借古讽今，写出对苟安偷生的激愤与对气节的推重。", theme: "夏·消夏纳凉"},
  // 8月·新秋
  {month: [8], term: ["立秋", "处暑"], title: "山居秋暝", author: "唐 · 王维",
   content: ["空山新雨后，", "天气晚来秋。", "明月松间照，", "清泉石上流。", "竹喧归浣女，", "莲动下渔舟。", "随意春芳歇，", "王孙自可留。"],
   appreciation: "空山新雨、明月松间、清泉石上，动静相衬；浣女喧归、渔舟下动，添人间生趣。末联“王孙自可留”道出归隐之志，写景清丽，诗中有画。", theme: "秋·新秋初凉"},
  {month: [8], term: ["立秋", "处暑"], title: "早秋", author: "唐 · 许浑",
   content: ["遥夜泛清瑟，", "西风生翠萝。", "残萤栖玉露，", "早雁拂银河。", "高树晓还密，", "远山晴更多。", "淮南一叶下，", "自觉老烟波。"],
   appreciation: "遥夜清瑟、西风翠萝、残萤早雁、高树晴山，写早秋景物由夜及昼；“高树晓还密，远山晴更多”捕捉早秋叶未凋、山愈明的物候特征，清隽疏朗。", theme: "秋·新秋初凉"},
  {month: [8], term: ["立秋", "处暑"], title: "立秋", author: "宋 · 刘翰",
   content: ["乱鸦啼散玉屏空，", "一枕新凉一扇风。", "睡起秋声无觅处，", "满阶梧叶月明中。"],
   appreciation: "乳鸦啼散、玉屏空、一枕新凉，写立秋夜凉之感；睡起寻秋声不得，唯见满阶梧叶、月明如水，以景写秋意，清空淡远。", theme: "秋·新秋初凉"},
  {month: [8], term: ["立秋", "处暑"], title: "秋登宣城谢朓北楼", author: "唐 · 李白",
   content: ["江城如画里，", "山晓望晴空。", "两水夹明镜，", "双桥落彩虹。", "人烟寒橘柚，", "秋色老梧桐。", "谁念北楼上，", "临风怀谢公。"],
   appreciation: "江城如画，两水夹镜、双桥落虹，以明丽之景写秋日宣城；“人烟寒橘柚，秋色老梧桐”着一“寒”一“老”染出秋意，末怀谢朓，寄寓知音寥落之思。", theme: "秋·新秋初凉"},
  // 9月·秋月
  {month: [9], term: ["白露", "秋分", "中秋"], title: "暮江吟", author: "唐 · 白居易",
   content: ["一道残阳铺水中，", "半江瑟瑟半江红。", "可怜九月初三夜，", "露似真珠月似弓。"],
   appreciation: "“一道残阳铺水中，半江瑟瑟半江红”写日落江景之绚丽，“露似真珠月似弓”写夜露新月的清丽；两联分写暮、夜两时，色彩明快，为写景名篇。", theme: "秋·秋月澄明"},
  {month: [9], term: ["白露", "秋分", "中秋"], title: "望月怀远", author: "唐 · 张九龄",
   content: ["海上生明月，", "天涯共此时。", "情人怨遥夜，", "竟夕起相思。", "灭烛怜光满，", "披衣觉露滋。", "不堪盈手赠，", "还寝梦佳期。"],
   appreciation: "“海上生明月，天涯共此时”以阔大之境写人间共通之情；灭烛、披衣、觉露沾衣，层层写彻夜怀人；“不堪盈手赠，还寝梦佳期”以虚望作结，含蓄不尽。", theme: "秋·秋月澄明"},
  {month: [9], term: ["白露", "秋分", "中秋"], title: "十五夜望月", author: "唐 · 王建",
   content: ["中庭地白树栖鸦，", "冷露无声湿桂花。", "今夜月明人尽望，", "不知秋思落谁家。"],
   appreciation: "中庭地白、树栖鸦、冷露湿桂花，写中秋月色的清冷寂静；末句“不知秋思落谁家”由己及人，把望月怀远之情推及众人，含蓄悠远。", theme: "秋·秋月澄明"},
  {month: [9], term: ["白露", "秋分", "中秋"], title: "秋词", author: "唐 · 刘禹锡",
   content: ["自古逢秋悲寂寥，", "我言秋日胜春朝。", "晴空一鹤排云上，", "便引诗情到碧霄。"],
   appreciation: "一反逢秋悲寂寥的旧调，“我言秋日胜春朝”直抒豪情；晴空一鹤排云直上，以鹤之高飞写昂扬意气，一反前人悲秋之作，气象开朗。", theme: "秋·秋月澄明"},
  // 10月·深秋
  {month: [10], term: ["寒露", "霜降", "重阳"], title: "九月九日忆山东兄弟", author: "唐 · 王维",
   content: ["独在异乡为异客，", "每逢佳节倍思亲。", "遥知兄弟登高处，", "遍插茱萸少一人。"],
   appreciation: "“独在异乡为异客，每逢佳节倍思亲”直抒思乡之情；后两句遥想兄弟登高插茱萸而独少一人，从对面着笔，把思念写得更深更切。", theme: "秋·深秋登高"},
  {month: [10], term: ["寒露", "霜降", "重阳"], title: "山行", author: "唐 · 杜牧",
   content: ["远上寒山石径斜，", "白云生处有人家。", "停车坐爱枫林晚，", "霜叶红于二月花。"],
   appreciation: "远上寒山、石径斜、白云深处有人家，写山行所见之景；末句“停车坐爱枫林晚，霜叶红于二月花”以春花比秋叶，写尽秋色之艳，意境高远。", theme: "秋·深秋登高"},
  {month: [10], term: ["寒露", "霜降", "重阳"], title: "枫桥夜泊", author: "唐 · 张继",
   content: ["月落乌啼霜满天，", "江枫渔火对愁眠。", "姑苏城外寒山寺，", "夜半钟声到客船。"],
   appreciation: "月落乌啼、霜满天、江枫渔火，写夜泊所见的凄清之景；姑苏城外寒山寺，夜半钟声到客船，以声衬静，写尽羁旅愁思，意境清远。", theme: "秋·深秋登高"},
  {month: [10], term: ["寒露", "霜降", "重阳"], title: "登高", author: "唐 · 杜甫",
   content: ["风急天高猿啸哀，", "渚清沙白鸟飞回。", "无边落木萧萧下，", "不尽长江滚滚来。", "万里悲秋常作客，", "百年多病独登台。", "艰难苦恨繁霜鬓，", "潦倒新停浊酒杯。"],
   appreciation: "前四句写景苍茫阔大：风急天高、猿啸鸟回、无边落木、不尽长江；后四句由景入情，万里悲秋、百年多病、艰难潦倒层层递进，沉郁顿挫，被誉为古今七律第一。", theme: "秋·深秋登高"},
  // 11月·初冬
  {month: [11], term: ["立冬", "小雪"], title: "早冬", author: "唐 · 白居易",
   content: ["十月江南天气好，", "可怜冬景似春华。", "霜轻未杀萋萋草，", "日暖初干漠漠沙。", "老柘叶黄如嫩树，", "寒樱枝白是狂花。", "此时却羡闲人醉，", "五马无由入酒家。"],
   appreciation: "写江南十月天暖气佳：霜轻未杀草、日暖初干沙，以轻柔之笔写早冬似春；末联自嘲“闲人”与老柘寒樱相对，闲雅中微露身世之感。", theme: "冬·初冬萧瑟"},
  {month: [11], term: ["立冬", "小雪"], title: "岁暮归南山", author: "唐 · 孟浩然",
   content: ["北阙休上书，", "南山归敝庐。", "不才明主弃，", "多病故人疏。", "白发催年老，", "青阳逼岁除。", "永怀愁不寐，", "松月夜窗虚。"],
   appreciation: "北阙上书不成，南山归卧敝庐；“不才明主弃，多病故人疏”以自伤之语写不遇之慨，白发催年、青阳逼岁，末句“松月夜窗虚”以空寂之境收束归隐闲愁。", theme: "冬·初冬萧瑟"},

let currentDate = new Date();

// 格式化日期
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 获取农历日期（简化版）
function getLunar(d) {
  const lunarMonths = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
  const lunarDays = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                     "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                     "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
  // 简化：按月份+日期取对应农历（近似，仅作演示）
  const m = d.getMonth() + 1;
  const day = d.getDate();
  // 农历近似偏移约1个半月
  let lm = m - 1;
  let ld = day;
  if (ld > 30) ld = 30;
  if (lm < 1) lm = 12;
  return {
    month: lunarMonths[lm-1],
    day: lunarDays[ld-1]
  };
}

// 获取节气
function getSolarTerm(d) {
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const terms = solarTerms[m];
  if (!terms) return "";
  for (const [td, name] of Object.entries(terms)) {
    if (Math.abs(day - parseInt(td)) <= 1) return name;
  }
  return "";
}

// 获取节日
function getFestival(d) {
  const key = `${d.getMonth()+1}-${d.getDate()}`;
  const f1 = festivals[key] || "";
  // 近似农历节日
  const lunarF = {
    "2-12": "元宵节", "2-14": "情人节", "6-18": "端午节", 
    "8-17": "七夕节", "9-17": "中秋节", "10-18": "重阳节"
  };
  const f2 = lunarF[key] || "";
  return [f1, f2].filter(Boolean).join(" · ");
}

// 选择今日诗词
function selectPoem(d) {
  const m = d.getMonth() + 1;
  const term = getSolarTerm(d);
  const fest = getFestival(d);
  
  // 优先匹配节气/节日
  for (const p of poemDB) {
    if (p.term.length > 0 && (p.term.includes(term) || p.term.some(t => fest.includes(t)))) {
      return p;
    }
  }
  // 按月份匹配
  for (const p of poemDB) {
    if (p.month.includes(m)) return p;
  }
  // 通用
  return poemDB[poemDB.length - 2];
}

// 获取季节
function getSeason(m) {
  if (m >=3 && m <=5) return {name: "春", poems: poemDB.filter(p => p.theme.includes("春"))};
  if (m >=6 && m <=8) return {name: "夏", poems: poemDB.filter(p => p.theme.includes("夏") || p.theme.includes("荷"))};
  if (m >=9 && m <=11) return {name: "秋", poems: poemDB.filter(p => p.theme.includes("秋") || p.theme.includes("枫"))};
  return {name: "冬", poems: poemDB.filter(p => p.theme.includes("冬") || p.theme.includes("雪"))};
}

// 渲染日历
function renderCalendar() {
  const d = currentDate;
  document.getElementById('dateDay').textContent = d.getDate();
  document.getElementById('dateMonthYear').textContent = `${d.getFullYear()}年${d.getMonth()+1}月`;
  
  const lunar = getLunar(d);
  document.getElementById('lunarDate').textContent = `${lunar.month}${lunar.day}`;
  
  const term = getSolarTerm(d);
  const fest = getFestival(d);
  document.getElementById('solarTerm').textContent = term || fest || "日常";
  document.getElementById('festival').textContent = fest && term ? fest : "";
  
  const poem = selectPoem(d);
  document.getElementById('poemTitle').textContent = poem.title;
  document.getElementById('poemAuthor').textContent = poem.author;
  document.getElementById('poemContent').innerHTML = poem.content.map(line => `<p>${line}</p>`).join('');
  document.getElementById('poemAppreciation').textContent = poem.appreciation;
  
  document.getElementById('datePicker').value = formatDate(d);
  
  // 季节主题色
  const season = getSeason(d.getMonth() + 1);
  const colors = {
    "春": "#2E6B4F",
    "夏": "#8B3A2F", 
    "秋": "#b8860b",
    "冬": "#3F6680"
  };
  document.getElementById('calendarHeader').style.background = `linear-gradient(135deg, ${colors[season.name]}, ${colors[season.name]}cc)`;
  document.getElementById('seasonTitle').textContent = `${season.name}日詩選`;
  document.getElementById('seasonGrid').innerHTML = season.poems.map(p => `
    <div class="poem-card" onclick="showPoem('${p.title}')">
      <div class="poem-card-title">${p.title}</div>
      <div class="poem-card-author">${p.author}</div>
      <div class="poem-card-preview">${p.content[0]}${p.content[1] || ''}</div>
      <span class="theme-tag">${p.theme}</span>
    </div>
  `).join('');
}

function showPoem(title) {
  const p = poemDB.find(x => x.title === title);
  if (p) {
    document.getElementById('poemTitle').textContent = p.title;
    document.getElementById('poemAuthor').textContent = p.author;
    document.getElementById('poemContent').innerHTML = p.content.map(line => `<p>${line}</p>`).join('');
    document.getElementById('poemAppreciation').textContent = p.appreciation;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function changeDay(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  renderCalendar();
}

function pickDate(val) {
  if (val) {
    currentDate = new Date(val);
    renderCalendar();
  }
}

function goToday() {
  currentDate = new Date();
  renderCalendar();
}

renderCalendar();
</script>

<script>
window.addEventListener('scroll', ()=>{
  const btn = document.getElementById('backToTop');
  if(btn) btn.classList.toggle('show', window.scrollY>300);
});
document.addEventListener('click', (e)=>{
  if(e.target.id === 'backToTop') window.scrollTo({top:0,behavior:'smooth'});
});
let petalsOn = localStorage.getItem('petals')==='true';
let petalTimer = null;
function togglePetals(){
  petalsOn = !petalsOn;
  localStorage.setItem('petals', petalsOn);
  petalsOn ? startPetals() : stopPetals();
}
function startPetals(){
  if(petalTimer) return;
  petalTimer = setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*7) + 's';
    const s = 6 + Math.random()*8;
    p.style.width = p.style.height = s + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 15000);
  }, 700);
}
function stopPetals(){
  clearInterval(petalTimer);
  petalTimer = null;
}
if(petalsOn) startPetals();
// 夜读模式兼容
document.querySelectorAll('.night-btn, [onclick*="night"]').forEach(btn=>{
  btn.addEventListener('click', ()=>document.body.classList.toggle('night'));
});
// 卷轴入场
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelector('.container, .main, .content')?.classList.add('scroll-unfold');
});
</script>
