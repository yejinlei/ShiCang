// 四季诗词库（按月份/节气/节日匹配）

  // 春
  {month: [1,2,12], term: ["立春","春节","元旦"], title: "元日", author: "宋 · 王安石",

    appreciation: "描写新年元日热闹欢乐、万象更新的景象，抒发作者革新政治的抱负，充满积极奋发精神。",
    theme: "新年"},
  {month: [2], term: ["立春","雨水"], title: "春夜喜雨", author: "唐 · 杜甫",

    appreciation: "赞美春雨来得及时、默默滋润万物，表达对春天到来的喜悦之情。", theme: "春雨"},
  {month: [3], term: ["惊蛰","春分"], title: "钱塘湖春行", author: "唐 · 白居易",

  {month: [3,4], term: ["清明"], title: "清明", author: "唐 · 杜牧",

  {month: [6,7], term: ["小暑","大暑"], title: "夏日南亭怀辛大", author: "唐 · 孟浩然",
    content: ["山光忽西落，池月渐东上。","散发乘夕凉，开轩卧闲敞。","荷风送香气，竹露滴清响。","欲取鸣琴弹，恨无知音赏。"],

    content: ["东风夜放花千树，更吹落、星如雨。","宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。","众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"],
    appreciation: "描写元宵节热闹繁华的景象，"蓦然回首"三句成为千古名句。", theme: "元宵"},
  // 日常通用
  {month: [], term: [], title: "饮酒·其五", author: "东晋 · 陶渊明",

let currentDate = new Date();

// 格式化日期
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 获取农历日期（简化版）
function getLunar(d) {
  const lunarMonths = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
  const lunarDays = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                     "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                     "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
  // 简化：按月份+日期取对应农历（近似，仅作演示）
  const m = d.getMonth() + 1;
  const day = d.getDate();
  // 农历近似偏移约1个半月
  let lm = m - 1;
  let ld = day;
  if (ld > 30) ld = 30;
  if (lm < 1) lm = 12;
  return {
    month: lunarMonths[lm-1],
    day: lunarDays[ld-1]
  };
}

// 获取节气
function getSolarTerm(d) {
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const terms = solarTerms[m];
  if (!terms) return "";
  for (const [td, name] of Object.entries(terms)) {
    if (Math.abs(day - parseInt(td)) <= 1) return name;
  }
  return "";
}

// 获取节日
function getFestival(d) {
  const key = `${d.getMonth()+1}-${d.getDate()}`;
  const f1 = festivals[key] || "";
  // 近似农历节日
  const lunarF = {
    "2-12": "元宵节", "2-14": "情人节", "6-18": "端午节", 
    "8-17": "七夕节", "9-17": "中秋节", "10-18": "重阳节"
  };
  const f2 = lunarF[key] || "";
  return [f1, f2].filter(Boolean).join(" · ");
}

// 选择今日诗词
function selectPoem(d) {
  const m = d.getMonth() + 1;
  const term = getSolarTerm(d);
  const fest = getFestival(d);
  
  // 优先匹配节气/节日
  for (const p of poemDB) {
    if (p.term.length > 0 && (p.term.includes(term) || p.term.some(t => fest.includes(t)))) {
      return p;
    }
  }
  // 按月份匹配
  for (const p of poemDB) {
    if (p.month.includes(m)) return p;
  }
  // 通用
  return poemDB[poemDB.length - 2];
}

// 获取季节
function getSeason(m) {
  if (m >=3 && m <=5) return {name: "春", poems: poemDB.filter(p => p.theme.includes("春"))};
  if (m >=6 && m <=8) return {name: "夏", poems: poemDB.filter(p => p.theme.includes("夏") || p.theme.includes("荷"))};
  if (m >=9 && m <=11) return {name: "秋", poems: poemDB.filter(p => p.theme.includes("秋") || p.theme.includes("枫"))};
  return {name: "冬", poems: poemDB.filter(p => p.theme.includes("冬") || p.theme.includes("雪"))};
}

// 渲染日历
function renderCalendar() {
  const d = currentDate;
  document.getElementById('dateDay').textContent = d.getDate();
  document.getElementById('dateMonthYear').textContent = `${d.getFullYear()}年${d.getMonth()+1}月`;
  
  const lunar = getLunar(d);
  document.getElementById('lunarDate').textContent = `${lunar.month}${lunar.day}`;
  
  const term = getSolarTerm(d);
  const fest = getFestival(d);
  document.getElementById('solarTerm').textContent = term || fest || "日常";
  document.getElementById('festival').textContent = fest && term ? fest : "";
  
  const poem = selectPoem(d);
  document.getElementById('poemTitle').textContent = poem.title;
  document.getElementById('poemAuthor').textContent = poem.author;
  document.getElementById('poemContent').innerHTML = poem.content.map(line => `<p>${line}</p>`).join('');
  document.getElementById('poemAppreciation').textContent = poem.appreciation;
  
  document.getElementById('datePicker').value = formatDate(d);
  
  // 季节主题色
  const season = getSeason(d.getMonth() + 1);
  const colors = {
    "春": "#2E6B4F",
    "夏": "#8B3A2F", 
    "秋": "#b8860b",
    "冬": "#3F6680"
  };
  document.getElementById('calendarHeader').style.background = `linear-gradient(135deg, ${colors[season.name]}, ${colors[season.name]}cc)`;
  document.getElementById('seasonTitle').textContent = `${season.name}日詩選`;
  document.getElementById('seasonGrid').innerHTML = season.poems.map(p => `
    <div class="poem-card" onclick="showPoem('${p.title}')">
      <div class="poem-card-title">${p.title}</div>
      <div class="poem-card-author">${p.author}</div>
      <div class="poem-card-preview">${p.content[0]}${p.content[1] || ''}</div>
      <span class="theme-tag">${p.theme}</span>
    </div>
  `).join('');
}

function showPoem(title) {
  const p = poemDB.find(x => x.title === title);
  if (p) {
    document.getElementById('poemTitle').textContent = p.title;
    document.getElementById('poemAuthor').textContent = p.author;
    document.getElementById('poemContent').innerHTML = p.content.map(line => `<p>${line}</p>`).join('');
    document.getElementById('poemAppreciation').textContent = p.appreciation;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function changeDay(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  renderCalendar();
}

function pickDate(val) {
  if (val) {
    currentDate = new Date(val);
    renderCalendar();
  }
}

function goToday() {
  currentDate = new Date();
  renderCalendar();
}

renderCalendar();
</script>
