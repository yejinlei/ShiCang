  :root {

    --vermilion: #8B3A2F;
    --vermilion-light: #a84a3d;
    --seal: #a52a2a;
    --gold: #b8860b;
    --green: #2E6B4F;
    --blue: #3F6680;
    --purple: #5A4A7A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(246,239,224,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(139,58,47,0.2);
    padding: 0.8rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .navbar-brand {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 1.4rem; color: var(--vermilion); text-decoration: none;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .navbar-brand::before {
    content: '詩'; display: inline-flex; align-items: center; justify-content: center;
    width: 2rem; height: 2rem; background: var(--vermilion); color: var(--paper);
    border-radius: 4px; font-size: 1.2rem;
  }
  .navbar-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }

  }
  .navbar-links a:hover, .navbar-links a.active {
    color: var(--vermilion); background: rgba(139,58,47,0.08);
  }
  .navbar-links a.active { font-weight: 500; }
  .nav-toggle {
    display: none; background: none; border: none; font-size: 1.5rem;
    color: var(--vermilion); cursor: pointer;
  }

  .page-header {
    text-align: center; margin-bottom: 2rem;

  }
  .page-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 2.8rem; color: var(--vermilion); margin-bottom: 0.5rem;
  }
  .page-subtitle {
    color: var(--ink-light); font-size: 1.1rem; letter-spacing: 0.2em;
  }
  .seal {
    display: inline-block; margin-top: 1rem; padding: 0.3rem 0.6rem;
    background: var(--seal); color: var(--paper);
    font-size: 0.8rem; border-radius: 2px; letter-spacing: 0.1em;
  }

  .calendar-card {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(139,58,47,0.2);
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(139,58,47,0.1);
  }
  .calendar-header {
    background: linear-gradient(135deg, var(--vermilion), var(--vermilion-light));

    display: flex; justify-content: space-between; align-items: center;
  }
  .calendar-date {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 3.5rem; line-height: 1;
  }
  .calendar-month-year {
    font-size: 1.2rem; opacity: 0.9; margin-top: 0.5rem; letter-spacing: 0.1em;
  }
  .calendar-lunar {
    text-align: right;
  }
  .lunar-date {
    font-size: 1.5rem; margin-bottom: 0.3rem;
  }
  .solar-term {
    font-size: 1rem; opacity: 0.9; padding: 0.3rem 0.8rem;
    background: rgba(255,255,255,0.2); border-radius: 20px; display: inline-block;
  }
  .festival {
    margin-top: 0.3rem; font-size: 0.9rem; color: var(--gold);
  }

  .calendar-body {
    padding: 3rem 2rem;
    text-align: center;
  }
  .poem-section {
    margin-bottom: 2rem;
  }
  .poem-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 2rem; color: var(--ink); margin-bottom: 0.5rem;
  }
  .poem-author {
    color: var(--ink-light); font-size: 1rem; margin-bottom: 2rem;
  }
  .poem-content {
    font-size: 1.5rem; line-height: 2.8; letter-spacing: 0.2em;
    color: var(--ink); margin-bottom: 2rem;
  }
  .poem-content p { margin-bottom: 0.5rem; }
  .poem-appreciation {
    max-width: 700px; margin: 0 auto;
    text-align: left; color: var(--ink-light); line-height: 2;
    padding: 1.5rem; background: rgba(246,239,224,0.5);
    border-left: 3px solid var(--vermilion); border-radius: 0 4px 4px 0;
  }

  .calendar-nav {
    display: flex; justify-content: center; gap: 1rem;
    padding: 1.5rem; border-top: 1px solid rgba(139,58,47,0.1);
    background: rgba(246,239,224,0.5);
  }
  .nav-btn {
    padding: 0.6rem 1.2rem; background: transparent;
    border: 1px solid rgba(139,58,47,0.3); color: var(--vermilion);
    font-family: 'Noto Serif SC', serif; font-size: 0.95rem;
    border-radius: 4px; cursor: pointer; transition: all 0.3s;
  }
  .nav-btn:hover {
    background: var(--vermilion); color: var(--paper);
    border-color: var(--vermilion);
  }
  .nav-btn.today {
    background: var(--vermilion); color: var(--paper); border-color: var(--vermilion);
  }
  .date-input {
    padding: 0.6rem; font-family: 'Noto Serif SC', serif;
    border: 1px solid rgba(139,58,47,0.3); border-radius: 4px;
    background: rgba(255,255,255,0.7); color: var(--ink);
  }

  .season-poems {
    margin-top: 2rem;
  }
  .section-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 1.5rem; color: var(--vermilion); text-align: center;
    margin-bottom: 1.5rem;
  }
  .season-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .poem-card {
    padding: 1.5rem; background: rgba(255,255,255,0.5);
    border: 1px solid rgba(139,58,47,0.15); border-radius: 8px;
    cursor: pointer; transition: all 0.3s;
  }
  .poem-card:hover {
    background: rgba(255,255,255,0.8); border-color: var(--vermilion);
    transform: translateY(-2px);
  }
  .poem-card-title {
    font-weight: 600; color: var(--ink); margin-bottom: 0.3rem;
  }
  .poem-card-author {
    font-size: 0.85rem; color: var(--ink-light); margin-bottom: 0.8rem;
  }
  .poem-card-preview {
    font-size: 0.95rem; color: var(--ink); line-height: 1.8;
  }
  .theme-tag {
    display: inline-block; margin-top: 0.8rem; padding: 0.2rem 0.6rem;
    background: rgba(139,58,47,0.1); color: var(--vermilion);
    font-size: 0.8rem; border-radius: 3px;
  }

  @media (max-width: 768px) {
    .navbar { padding: 0.6rem 1rem; }
    .navbar-links { display: none; flex-direction: column; position: absolute;

      padding: 1rem; border-bottom: 1px solid rgba(139,58,47,0.2); }
    .navbar-links.show { display: flex; }
    .nav-toggle { display: block; }
    .container { padding: 1rem; }
    .page-title { font-size: 2rem; }
    .calendar-header { flex-direction: column; text-align: center; gap: 1rem; padding: 1.5rem; }
    .calendar-date { font-size: 2.5rem; }
    .calendar-lunar { text-align: center; }
    .poem-content { font-size: 1.2rem; line-height: 2.2; }
    .calendar-body { padding: 2rem 1rem; }
    .calendar-nav { flex-wrap: wrap; }
  }

  .term-cell { padding:0.55rem 0.3rem; background:rgba(255,255,255,0.5);

  .term-cell.cur .tc-name, .term-cell.cur .tc-date { color:var(--paper); }

<div class="container">
  <div class="page-header">
    <h1 class="page-title">詩詞日曆</h1>
    <p class="page-subtitle">日日有詩 · 歲歲有情</p>
    <span class="seal">日讀一詩</span>
  </div>

  <div class="calendar-card">
    <div class="calendar-header" id="calendarHeader">
      <div>
        <div class="calendar-date" id="dateDay">1</div>
        <div class="calendar-month-year" id="dateMonthYear">2024年1月</div>
      </div>
      <div class="calendar-lunar">
        <div class="lunar-date" id="lunarDate">正月初一</div>
        <div class="solar-term" id="solarTerm">春节</div>
        <div class="festival" id="festival"></div>
      </div>
    </div>

    <div class="calendar-body">
      <div class="poem-section">
        <div class="poem-title" id="poemTitle">元日</div>
        <div class="poem-author" id="poemAuthor">宋 · 王安石</div>
        <div class="poem-content" id="poemContent">
          <p>爆竹声中一岁除，</p>
          <p>春风送暖入屠苏。</p>
          <p>千门万户曈曈日，</p>
          <p>总把新桃换旧符。</p>
        </div>
        <div class="poem-appreciation" id="poemAppreciation">
          此诗描写新年元日热闹、欢乐和万象更新的动人景象，抒发了作者革新政治的思想感情，充满欢快及积极向上的奋发精神。
        </div>
      </div>
    </div>

    <div class="calendar-nav">
      <button class="nav-btn" onclick="changeDay(-1)">← 前一天</button>
      <input type="date" class="date-input" id="datePicker" onchange="pickDate(this.value)">
      <button class="nav-btn today" onclick="goToday()">今日</button>
      <button class="nav-btn" onclick="changeDay(1)">后一天 →</button>
    </div>
  </div>

  <div class="season-poems">
    <h2 class="section-title" id="seasonTitle">當季詩選</h2>
    <div class="season-grid" id="seasonGrid"></div>
  </div>

  <div class="season-poems">
    <h2 class="section-title" id="termTableTitle">歲時節氣表</h2>
    <div class="term-table" id="termTable"></div>
  </div>
</div>

function _lunarInfo(y){ return LUNAR_INFOS[y-1900]; }
function _leapMonth(y){ return _lunarInfo(y) & 0xf; }
function _leapDays(y){ return _leapMonth(y) ? ((_lunarInfo(y) & 0x10000) ? 30 : 29) : 0; }
function _monthDays(y,m){ return (_lunarInfo(y) & (0x10000 >> m)) ? 30 : 29; }
function _yearDays(y){ var sum=348; for(var i=0x8000;i>0x8;i>>=1){ sum += (_lunarInfo(y)&i)?1:0; } return sum+_leapDays(y); }

// 公历 -> 农历（1900-2099）
function solar2lunar(y,m,d){
  if(y<1900||y>2099) return null;
  var base=Date.UTC(1900,0,31), cur=Date.UTC(y,m-1,d);
  var offset=Math.round((cur-base)/86400000);
  var i,temp=0;
  for(i=1900;i<2100 && offset>0;i++){ temp=_yearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  var ly=i, leap=_leapMonth(ly), isLeap=false;
  for(i=1;i<13 && offset>0;i++){
    if(leap>0 && i===leap+1 && !isLeap){ i--; isLeap=true; temp=_leapDays(ly); }
    else { temp=_monthDays(ly,i); }
    if(isLeap && i===leap+1) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && i===leap+1){ if(isLeap){ isLeap=false; } else { isLeap=true; i--; } }
  if(offset<0){ offset+=temp; i--; }
  return { year:ly, month:i, day:offset+1, isLeap:isLeap };
}

function _mmdd(m,d){ return (m<10?'0':'')+m + (d<10?'0':'')+d; }

// 当日节气名（精确到交节日）
function getSolarTerm(d){
  var arr=TERM_DATA[d.getFullYear()]; if(!arr) return "";
  var key=_mmdd(d.getMonth()+1,d.getDate());
  for(var i=0;i<24;i++){ if(arr[i]===key) return TERM_NAMES[i]; }
  return "";
}
// 当前所处节气（<= 该日的最近节气）
function currentTerm(d){
  var y=d.getFullYear(), arr=TERM_DATA[y];
  var key=_mmdd(d.getMonth()+1,d.getDate()), best="";
  if(arr){ for(var i=0;i<24;i++){ if(arr[i] && arr[i]<=key) best=TERM_NAMES[i]; } }
  if(!best){ best="冬至"; }
  return best;
}
// 节日（公历 + 农历）
function getFestival(d){
  var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  var out=[], k=m+"-"+day;
  if(SOLAR_FEST[k]) out.push(SOLAR_FEST[k]);
  var l=solar2lunar(y,m,day);
  if(l && !l.isLeap){
    var lk=l.month+"-"+l.day;
    if(LUNAR_FEST[lk]) out.push(LUNAR_FEST[lk]);
    if(l.month===12 && l.day===_monthDays(l.year,12)) out.push("除夕");
  }
  return out;
}
function lunarText(d){
  var l=solar2lunar(d.getFullYear(),d.getMonth()+1,d.getDate());
  if(!l) return "";
  return LUNAR_MONTHS[l.month-1]+LUNAR_DAYS[l.day-1]+(l.isLeap?"（闰）":"");
}

const poemDB = [{"title":"梅花","author":"宋 · 王安石","content":["墙角数枝梅，","凌寒独自开。","遥知不是雪，","为有暗香来。"],"appreciation":"以墙角数枝梅起笔，“凌寒独自开”写其傲寒独放；后两句借雪设疑、以香辨梅，妙在“遥知不是雪，为有暗香来”——以雪比梅之白，以香别梅之真，托物言志，赞颂身处逆境仍守高洁的品格。","terms":["小寒"],"festivals":[],"theme":"冬·小寒"},{"title":"寒夜","author":"宋 · 杜耒","content":["寒夜客来茶当酒，","竹炉汤沸火初红。","寻常一样窗前月，","才有梅花便不同。"],"appreciation":"寒夜客至，以茶当酒，竹炉汤沸、炉火初红，写围炉夜谈的温煦；末二句说窗前月色本自寻常，因有梅花映照便觉不同——以梅衬月、以月托梅，写主客相得的清雅，语淡而味永。","terms":["小寒"],"festivals":[],"theme":"冬·小寒"},{"title":"江雪","author":"唐 · 柳宗元","content":["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"],"appreciation":"千山鸟绝、万径人踪灭，写天地之间的空旷寂寥；孤舟蓑笠翁，独钓寒江雪，以孤高清冷之境写诗人傲岸不屈之志，二十字如一幅冰雪图。","terms":["大寒"],"festivals":[],"theme":"冬·大寒"},{"title":"逢雪宿芙蓉山主人","author":"唐 · 刘长卿","content":["日暮苍山远，","天寒白屋贫。","柴门闻犬吠，","风雪夜归人。"],"appreciation":"日暮苍山远，天寒白屋贫，写投宿所见；后两句柴门犬吠、风雪夜归，由静入动，以白描勾勒山居寒夜图，“风雪夜归人”一句冷中见暖，苍茫中透出人间气息。","terms":["大寒"],"festivals":[],"theme":"冬·大寒"},{"title":"立春偶成","author":"宋 · 张栻","content":["律回岁晚冰霜少，","春到人间草木知。","便觉眼前生意满，","东风吹水绿参差。"],"appreciation":"以“律回岁晚冰霜少”点立春之候，冰雪渐消、草木先觉；“草木知”三字把春意写得有知有觉。末联“东风吹水绿参差”由虚入实，写春水初绿、波光参差，一片生机，为咏立春的名作。","terms":["立春"],"festivals":[],"theme":"春·立春"},{"title":"春雪","author":"唐 · 韩愈","content":["新年都未有芳华，","二月初惊见草芽。","白雪却嫌春色晚，","故穿庭树作飞花。"],"appreciation":"新年尚不见花，二月才惊见草芽，写春之来迟；后二句翻出新意——白雪嫌春色来晚，故穿庭树化作飞花。以雪拟人，把盼春之情写得分外灵动，是咏早春雪景的巧思之作。","terms":["立春"],"festivals":[],"theme":"春·立春"},{"title":"春夜喜雨","author":"唐 · 杜甫","content":["好雨知时节，","当春乃发生。","随风潜入夜，","润物细无声。","野径云俱黑，","江船火独明。","晓看红湿处，","花重锦官城。"],"appreciation":"通篇不着“喜”字却处处见喜。“好雨知时节”写雨之善解人意，“潜”“细”二字状其润物无声；尾联悬想天明锦官城花团锦簇，以虚写实，把一夜春雨的喜悦推到极处。","terms":["雨水"],"festivals":[],"theme":"春·雨水"},{"title":"咏柳","author":"唐 · 贺知章","content":["碧玉妆成一树高，","万条垂下绿丝绦。","不知细叶谁裁出，","二月春风似剪刀。"],"appreciation":"前两句以碧玉喻柳树、以绿丝绦喻柳条，化静为动；后两句“不知细叶谁裁出，二月春风似剪刀”以问答收束，将无形春风想象成能裁剪的巧手，比喻新奇，咏物而见春之生意。","terms":["雨水"],"festivals":[],"theme":"春·雨水"},{"title":"观田家","author":"唐 · 韦应物","content":["微雨众卉新，","一雷惊蛰始。","田家几日闲，","耕种从此起。","丁壮俱在野，","场圃亦就理。","归来景常晏，","饮犊西涧水。","饥劬不自苦，","膏泽且为喜。","仓禀无宿储，","徭役犹未已。","方惭不耕者，","禄食出闾里。"],"appreciation":"以“微雨众卉新，一雷惊蛰始”写惊蛰节候，雷动而农事起；继写丁壮在野、场圃就理、饮犊西涧，活画春耕图景。末以“方惭不耕者，禄食出闾里”自省，悯农之意深挚，是节气诗中的佳制。","terms":["惊蛰"],"festivals":[],"theme":"春·惊蛰"},{"title":"春晓","author":"唐 · 孟浩然","content":["春眠不觉晓，","处处闻啼鸟。","夜来风雨声，","花落知多少。"],"appreciation":"从春睡初醒写起，以处处鸟啼、夜来风雨、花落多少串起晨间所闻所想；全篇不写所见而写所感，由听觉牵出惜春之情，语言平易自然，余味悠长。","terms":["惊蛰"],"festivals":[],"theme":"春·惊蛰"},{"title":"钱塘湖春行","author":"唐 · 白居易","content":["孤山寺北贾亭西，","水面初平云脚低。","几处早莺争暖树，","谁家新燕啄春泥。","乱花渐欲迷人眼，","浅草才能没马蹄。","最爱湖东行不足，","绿杨阴里白沙堤。"],"appreciation":"以“行”为线索移步换景：孤山寺北、水面初平，早莺争树、新燕啄泥，乱花浅草次第入目。“渐欲”“才能”写出早春初生未盛之态，末句最爱湖东白堤，收束明快。","terms":["春分"],"festivals":[],"theme":"春·春分"},{"title":"城东早春","author":"唐 · 杨巨源","content":["诗家清景在新春，","绿柳才黄半未匀。","若待上林花似锦，","出门俱是看花人。"],"appreciation":"以“诗家清景在新春”立论，绿柳初黄、尚未匀色，写早春之新嫩；末句以“若待上林花似锦，出门俱是看花人”反衬，赞早春清景之独得，识见有别于常人。","terms":["春分"],"festivals":[],"theme":"春·春分"},{"title":"清明","author":"唐 · 杜牧","content":["清明时节雨纷纷，","路上行人欲断魂。","借问酒家何处有，","牧童遥指杏花村。"],"appreciation":"以“清明时节雨纷纷”起笔，写细雨纷纷、行人断魂，节令与心绪一并点出；“借问酒家何处有，牧童遥指杏花村”以问答收束，画面由烟雨转向杏花，哀而不伤，为咏清明的千古名篇。","terms":["清明"],"festivals":["清明节"],"theme":"春·清明"},{"title":"寒食","author":"唐 · 韩翃","content":["春城无处不飞花，","寒食东风御柳斜。","日暮汉宫传蜡烛，","轻烟散入五侯家。"],"appreciation":"春城飞花、东风御柳，写寒食节长安春色；“日暮汉宫传蜡烛，轻烟散入五侯家”写寒食赐火之制，以汉喻唐，暗讽权贵蒙恩，笔致含蓄，寓意深远。","terms":["清明"],"festivals":[],"theme":"春·清明"},{"title":"晚春","author":"唐 · 韩愈","content":["草树知春不久归，","百般红紫斗芳菲。","杨花榆荚无才思，","惟解漫天作雪飞。"],"appreciation":"草木知春将归而竞相斗艳，是拟人写法；杨花榆荚“无才思”，惟解漫天作雪飞，一反惜春的伤感，以戏谑之笔写晚春的热闹，别开生面。","terms":["谷雨"],"festivals":[],"theme":"春·谷雨"},{"title":"大林寺桃花","author":"唐 · 白居易","content":["人间四月芳菲尽，","山寺桃花始盛开。","长恨春归无觅处，","不知转入此中来。"],"appreciation":"山寺桃花与“人间四月芳菲尽”形成对照，“始盛开”三字点出山高地寒、花开较迟的物候之理；于寻春不遇之际忽逢盛景，惊喜之情溢于言表。","terms":["谷雨"],"festivals":[],"theme":"春·谷雨"},{"title":"山亭夏日","author":"唐 · 高骈","content":["绿树阴浓夏日长，","楼台倒影入池塘。","水晶帘动微风起，","满架蔷薇一院香。"],"appreciation":"绿树阴浓、楼台倒影、水晶帘动、满架蔷薇，前两句写静景，后两句由风动帘、香满院写动态；末句以嗅觉收束，写尽夏日庭院清幽凉爽。","terms":["立夏"],"festivals":[],"theme":"夏·立夏"},{"title":"小池","author":"宋 · 杨万里","content":["泉眼无声惜细流，","树阴照水爱晴柔。","小荷才露尖尖角，","早有蜻蜓立上头。"],"appreciation":"写泉眼、树阴、小荷、蜻蜓，一“惜”一“爱”将泉与树拟人；末句“早有蜻蜓立上头”定格细景，以小巧之物写初夏初生的清新生意。","terms":["立夏"],"festivals":[],"theme":"夏·立夏"},{"title":"乡村四月","author":"宋 · 翁卷","content":["绿遍山原白满川，","子规声里雨如烟。","乡村四月闲人少，","才了蚕桑又插田。"],"appreciation":"绿遍山原、白满川，子规声里雨如烟，写四月江南的葱茏烟雨；“乡村四月闲人少，才了蚕桑又插田”以农事之忙写节令之勤，白描见真，是小满前后的田家名篇。","terms":["小满"],"festivals":[],"theme":"夏·小满"},{"title":"三衢道中","author":"宋 · 曾几","content":["梅子黄时日日晴，","小溪泛尽却山行。","绿阴不减来时路，","添得黄鹂四五声。"],"appreciation":"梅子黄时、日日晴，小溪泛尽又改山行，记出游的行程；“绿阴不减来时路，添得黄鹂四五声”以声衬静，写出初夏山行的轻快愉悦，声色兼备。","terms":["小满"],"festivals":[],"theme":"夏·小满"},{"title":"四时田园杂兴·昼出耘田夜绩麻","author":"宋 · 范成大","content":["昼出耘田夜绩麻，","村庄儿女各当家。","童孙未解供耕织，","也傍桑阴学种瓜。"],"appreciation":"昼耘夜绩，村庄儿女各司其职，写农忙时节一家劳作的景象；末句写童孙不解耕织却傍桑学种瓜，以孩子的模仿写田园生趣，笔调活泼，是芒种农忙的生动写照。","terms":["芒种"],"festivals":[],"theme":"夏·芒种"},{"title":"约客","author":"宋 · 赵师秀","content":["黄梅时节家家雨，","青草池塘处处蛙。","有约不来过夜半，","闲敲棋子落灯花。"],"appreciation":"黄梅时节家家雨、青草池塘处处蛙，以声写静，点出江南梅雨时节的氛围；“有约不来过夜半，闲敲棋子落灯花”写候客不来的闲散心绪，细节传神，耐人品读。","terms":["芒种"],"festivals":[],"theme":"夏·芒种"},{"title":"晓出净慈寺送林子方","author":"宋 · 杨万里","content":["毕竟西湖六月中，","风光不与四时同。","接天莲叶无穷碧，","映日荷花别样红。"],"appreciation":"以“毕竟西湖六月中”总起，言六月风光别于四时；“接天莲叶无穷碧，映日荷花别样红”两句对举，碧叶接天、红荷映日，色彩浓烈，写尽盛夏西湖的盛丽。","terms":["夏至"],"festivals":[],"theme":"夏·夏至"},{"title":"六月二十七日望湖楼醉书","author":"宋 · 苏轼","content":["黑云翻墨未遮山，","白雨跳珠乱入船。","卷地风来忽吹散，","望湖楼下水如天。"],"appreciation":"二十八字写一场骤雨来去：黑云翻墨、白雨跳珠、卷地风来、水如天光。色彩明暗交替，节奏跌宕，把夏日西湖风雨的急骤与放晴写得如在目前。","terms":["夏至"],"festivals":[],"theme":"夏·夏至"},{"title":"夏日南亭怀辛大","author":"唐 · 孟浩然","content":["山光忽西落，","池月渐东上。","散发乘夕凉，","开轩卧闲敞。","荷风送香气，","竹露滴清响。","欲取鸣琴弹，","恨无知音赏。","感此怀故人，","中宵劳梦想。"],"appreciation":"“山光忽西落，池月渐东上”写夏夜初临，“荷风送香气，竹露滴清响”从嗅觉、听觉写纳凉之清；末以“恨无知音赏”转出怀友，写小暑夜凉中一缕思念，清而不冷。","terms":["小暑"],"festivals":[],"theme":"夏·小暑"},{"title":"纳凉","author":"宋 · 秦观","content":["携杖来追柳外凉，","画桥南畔倚胡床。","月明船笛参差起，","风定池莲自在香。"],"appreciation":"携杖追凉、画桥倚床写纳凉之态，月明船笛、风定池莲写夜境清幽；由动入静，末句“风定池莲自在香”以莲香透出凉意，闲适可味。","terms":["小暑"],"festivals":[],"theme":"夏·小暑"},{"title":"夏意","author":"宋 · 苏舜钦","content":["别院深深夏簟清，","石榴开遍透帘明。","树阴满地日当午，","梦觉流莺时一声。"],"appreciation":"别院深深、夏簟清凉、石榴开遍、树阴满地，层层铺写幽静之境以消暑；末句“流莺时一声”以声衬静，写出夏日午后的闲适安宁。","terms":["大暑"],"festivals":[],"theme":"夏·大暑"},{"title":"题西林壁","author":"宋 · 苏轼","content":["横看成岭侧成峰，","远近高低总不同。","不识庐山真面目，","只缘身在此山中。"],"appreciation":"前两句写横看侧看、远近高低，山形各异；后两句由观山悟理——不识庐山真面目，只因身在山中。即景说理，理趣深远，写景与哲思浑然一体。","terms":["大暑"],"festivals":[],"theme":"夏·大暑"},{"title":"立秋","author":"宋 · 刘翰","content":["乱鸦啼散玉屏空，","一枕新凉一扇风。","睡起秋声无觅处，","满阶梧叶月明中。"],"appreciation":"乳鸦啼散、玉屏空、一枕新凉，写立秋夜凉之感；睡起寻秋声不得，唯见满阶梧叶、月明如水，以景写秋意，清空淡远。","terms":["立秋"],"festivals":[],"theme":"秋·立秋"},{"title":"早秋","author":"唐 · 许浑","content":["遥夜泛清瑟，","西风生翠萝。","残萤栖玉露，","早雁拂银河。","高树晓还密，","远山晴更多。","淮南一叶下，","自觉老烟波。"],"appreciation":"遥夜清瑟、西风翠萝、残萤早雁、高树晴山，写早秋景物由夜及昼；“高树晓还密，远山晴更多”捕捉早秋叶未凋、山愈明的物候特征，清隽疏朗。","terms":["立秋"],"festivals":[],"theme":"秋·立秋"},{"title":"山居秋暝","author":"唐 · 王维","content":["空山新雨后，","天气晚来秋。","明月松间照，","清泉石上流。","竹喧归浣女，","莲动下渔舟。","随意春芳歇，","王孙自可留。"],"appreciation":"空山新雨、明月松间、清泉石上，动静相衬；浣女喧归、渔舟下动，添人间生趣。末联“王孙自可留”道出归隐之志，写景清丽，诗中有画。","terms":["处暑"],"festivals":[],"theme":"秋·处暑"},{"title":"秋登宣城谢朓北楼","author":"唐 · 李白","content":["江城如画里，","山晓望晴空。","两水夹明镜，","双桥落彩虹。","人烟寒橘柚，","秋色老梧桐。","谁念北楼上，","临风怀谢公。"],"appreciation":"江城如画，两水夹镜、双桥落虹，以明丽之景写秋日宣城；“人烟寒橘柚，秋色老梧桐”着一“寒”一“老”染出秋意，末怀谢朓，寄寓知音寥落之思。","terms":["处暑"],"festivals":[],"theme":"秋·处暑"},{"title":"暮江吟","author":"唐 · 白居易","content":["一道残阳铺水中，","半江瑟瑟半江红。","可怜九月初三夜，","露似真珠月似弓。"],"appreciation":"“一道残阳铺水中，半江瑟瑟半江红”写日落江景之绚丽，“露似真珠月似弓”写夜露新月的清丽；两联分写暮、夜两时，色彩明快，为写景名篇。","terms":["白露"],"festivals":[],"theme":"秋·白露"},{"title":"玉阶怨","author":"唐 · 李白","content":["玉阶生白露，","夜久侵罗袜。","却下水精帘，","玲珑望秋月。"],"appreciation":"全篇不着一“怨”字，只写玉阶生露、罗袜浸湿、放下水精帘、玲珑望月四事；以白露滋衣写夜久独立，以望月收束无尽之思，含蓄空灵，是宫怨小诗的绝唱。","terms":["白露"],"festivals":[],"theme":"秋·白露"},{"title":"秋词","author":"唐 · 刘禹锡","content":["自古逢秋悲寂寥，","我言秋日胜春朝。","晴空一鹤排云上，","便引诗情到碧霄。"],"appreciation":"一反逢秋悲寂寥的旧调，“我言秋日胜春朝”直抒豪情；晴空一鹤排云直上，以鹤之高飞写昂扬意气，一反前人悲秋之作，气象开朗。","terms":["秋分"],"festivals":[],"theme":"秋·秋分"},{"title":"望月怀远","author":"唐 · 张九龄","content":["海上生明月，","天涯共此时。","情人怨遥夜，","竟夕起相思。","灭烛怜光满，","披衣觉露滋。","不堪盈手赠，","还寝梦佳期。"],"appreciation":"“海上生明月，天涯共此时”以阔大之境写人间共通之情；灭烛、披衣、觉露沾衣，层层写彻夜怀人；“不堪盈手赠，还寝梦佳期”以虚望作结，含蓄不尽。","terms":["秋分"],"festivals":[],"theme":"秋·秋分"},{"title":"山行","author":"唐 · 杜牧","content":["远上寒山石径斜，","白云生处有人家。","停车坐爱枫林晚，","霜叶红于二月花。"],"appreciation":"远上寒山、石径斜、白云深处有人家，写山行所见之景；末句“停车坐爱枫林晚，霜叶红于二月花”以春花比秋叶，写尽秋色之艳，意境高远。","terms":["寒露"],"festivals":[],"theme":"秋·寒露"},{"title":"十五夜望月","author":"唐 · 王建","content":["中庭地白树栖鸦，","冷露无声湿桂花。","今夜月明人尽望，","不知秋思落谁家。"],"appreciation":"中庭地白、树栖鸦、冷露湿桂花，写中秋月色的清冷寂静；末句“不知秋思落谁家”由己及人，把望月怀远之情推及众人，含蓄悠远。","terms":["寒露"],"festivals":[],"theme":"秋·寒露"},{"title":"枫桥夜泊","author":"唐 · 张继","content":["月落乌啼霜满天，","江枫渔火对愁眠。","姑苏城外寒山寺，","夜半钟声到客船。"],"appreciation":"月落乌啼、霜满天、江枫渔火，写夜泊所见的凄清之景；姑苏城外寒山寺，夜半钟声到客船，以声衬静，写尽羁旅愁思，意境清远。","terms":["霜降"],"festivals":[],"theme":"秋·霜降"},{"title":"赠刘景文","author":"宋 · 苏轼","content":["荷尽已无擎雨盖，","菊残犹有傲霜枝。","一年好景君须记，","最是橙黄橘绿时。"],"appreciation":"荷尽无盖、菊残有枝，以荷菊的荣枯写深秋；“菊残犹有傲霜枝”赞其傲霜之节。末二句“最是橙黄橘绿时”转出新意，于萧瑟中见丰美，是咏秋末的名篇。","terms":["霜降"],"festivals":[],"theme":"秋·霜降"},{"title":"早冬","author":"唐 · 白居易","content":["十月江南天气好，","可怜冬景似春华。","霜轻未杀萋萋草，","日暖初干漠漠沙。","老柘叶黄如嫩树，","寒樱枝白是狂花。","此时却羡闲人醉，","五马无由入酒家。"],"appreciation":"写江南十月天暖气佳：霜轻未杀草、日暖初干沙，以轻柔之笔写早冬似春；末联自嘲“闲人”与老柘寒樱相对，闲雅中微露身世之感。","terms":["立冬"],"festivals":[],"theme":"冬·立冬"},{"title":"登高","author":"唐 · 杜甫","content":["风急天高猿啸哀，","渚清沙白鸟飞回。","无边落木萧萧下，","不尽长江滚滚来。","万里悲秋常作客，","百年多病独登台。","艰难苦恨繁霜鬓，","潦倒新停浊酒杯。"],"appreciation":"前四句写景苍茫阔大：风急天高、猿啸鸟回、无边落木、不尽长江；后四句由景入情，万里悲秋、百年多病、艰难潦倒层层递进，沉郁顿挫，被誉为古今七律第一。","terms":["立冬"],"festivals":[],"theme":"冬·立冬"},{"title":"塞下曲","author":"唐 · 卢纶","content":["月黑雁飞高，","单于夜遁逃。","欲将轻骑逐，","大雪满弓刀。"],"appreciation":"月黑雁飞、单于夜遁，写边塞夜战的一瞬；“欲将轻骑逐，大雪满弓刀”以漫天飞雪、弓刀裹白，写出将士追敌的凛然气概。二十字如一幅雪夜追兵图，是小雪前后的边塞名作。","terms":["小雪"],"festivals":[],"theme":"冬·小雪"},{"title":"终南望余雪","author":"唐 · 祖咏","content":["终南阴岭秀，","积雪浮云端。","林表明霁色，","城中增暮寒。"],"appreciation":"终南阴岭秀、积雪浮云端，写远望雪后山景的高洁；“林表明霁色，城中增暮寒”由山写到城，以城中暮寒反衬积雪之厚，用语省净，是咏雪的名篇。","terms":["小雪"],"festivals":[],"theme":"冬·小雪"},{"title":"白雪歌送武判官归京","author":"唐 · 岑参","content":["北风卷地白草折，","胡天八月即飞雪。","忽如一夜春风来，","千树万树梨花开。","散入珠帘湿罗幕，","狐裘不暖锦衾薄。","将军角弓不得控，","都护铁衣冷难着。","瀚海阑干百丈冰，","愁云惨淡万里凝。","中军置酒饮归客，","胡琴琵琶与羌笛。","纷纷暮雪下辕门，","风掣红旗冻不翻。","轮台东门送君去，","去时雪满天山路。","山回路转不见君，","雪上空留马行处。"],"appreciation":"北风卷地、八月飞雪，以“忽如一夜春风来，千树万树梨花开”写雪景奇丽，为咏雪千古名句；由写雪转入送别，瀚海阑干、愁云惨淡，末句“雪上空留马行处”情长意远。","terms":["大雪"],"festivals":[],"theme":"冬·大雪"},{"title":"别董大","author":"唐 · 高适","content":["千里黄云白日曛，","北风吹雁雪纷纷。","莫愁前路无知己，","天下谁人不识君。"],"appreciation":"千里黄云、白日昏曛、北风吹雁、大雪纷纷，先以苍茫冬景起势；后二句“莫愁前路无知己，天下谁人不识君”陡然振起，以豪语作别，一扫离愁，是送别诗中的高调。","terms":["大雪"],"festivals":[],"theme":"冬·大雪"},{"title":"小至","author":"唐 · 杜甫","content":["天时人事日相催，","冬至阳生春又来。","刺绣五纹添弱线，","吹葭六琯动浮灰。","岸容待腊将舒柳，","山意冲寒欲放梅。","云物不殊乡国异，","教儿且覆掌中杯。"],"appreciation":"写冬至阳生、春又将至，刺绣添线、吹葭动灰写节候民俗；末联以云物不殊、教儿覆杯自我宽解，羁旅在外而强作达观，愁思寓于平静之中。","terms":["冬至"],"festivals":["冬至节"],"theme":"冬·冬至"},{"title":"邯郸冬至夜思家","author":"唐 · 白居易","content":["邯郸驿里逢冬至，","抱膝灯前影伴身。","想得家中夜深坐，","还应说着远行人。"],"appreciation":"邯郸驿里逢冬至，抱膝灯前、唯影相伴，写客中孤寂；后二句由己及家，料想家人夜深围坐、正说着远行的自己，从对面落笔，思亲之情婉转深挚。","terms":["冬至"],"festivals":[],"theme":"冬·冬至"},{"title":"元日","author":"宋 · 王安石","content":["爆竹声中一岁除，","春风送暖入屠苏。","千门万户曈曈日，","总把新桃换旧符。"],"appreciation":"以“爆竹声中一岁除”开篇，写辞旧迎新的欢腾；春风送暖、屠苏酒，处处是新岁气象。末句“总把新桃换旧符”既写换桃符的年俗，又暗寓除旧布新的抱负，语带双关，是咏新年诗中的名篇。","terms":[],"festivals":["元旦","春节"],"theme":"节·岁首"},{"title":"田家元日","author":"唐 · 孟浩然","content":["昨夜斗回北，","今朝岁起东。","我年已强壮，","无禄尚忧农。","桑野就耕父，","荷锄随牧童。","田家占气候，","共说此年丰。"],"appreciation":"斗柄回北、岁起于东，写新年伊始；“我年已强壮，无禄尚忧农”道出无官而心系农桑的襟怀；末以田家共说丰年作结，写春节里朴素的祈愿，平实温厚。","terms":[],"festivals":["春节"],"theme":"节·岁首"},{"title":"正月十五夜","author":"唐 · 苏味道","content":["火树银花合，","星桥铁锁开。","暗尘随马去，","明月逐人来。","游伎皆秾李，","行歌尽落梅。","金吾不禁夜，","玉漏莫相催。"],"appreciation":"“火树银花合，星桥铁锁开”写元宵夜灯火之盛与弛禁之欢；暗尘随马、明月逐人写游人如织；末联“金吾不禁夜，玉漏莫相催”道出彻夜欢游、唯恐天明的兴致，是咏上元的名作。","terms":[],"festivals":["元宵节"],"theme":"节·上元"},{"title":"端午","author":"唐 · 文秀","content":["节分端午自谁言，","万古传闻为屈原。","堪笑楚江空渺渺，","不能洗得直臣冤。"],"appreciation":"以“节分端午自谁言”设问，点出端午与屈原的联系；后二句翻进一层——楚江渺渺，却洗不尽直臣之冤，于节俗中寄寓不平，议论警策，是咏端午的佳作。","terms":[],"festivals":["端午节"],"theme":"节·端午"},{"title":"秋夕","author":"唐 · 杜牧","content":["红烛秋光冷画屏，","轻罗小扇扑流萤。","天阶夜色凉如水，","坐看牵牛织女星。"],"appreciation":"银烛秋光、画屏、轻罗小扇扑流萤，写秋夜宫女的孤寂；卧看牵牛织女星，以天上团圆反衬人间寂寞，含蓄凄美，是宫怨诗的名作。","terms":[],"festivals":["七夕节"],"theme":"节·七夕"},{"title":"乞巧","author":"唐 · 林杰","content":["七夕今宵看碧霄，","牵牛织女渡河桥。","家家乞巧望秋月，","穿尽红丝几万条。"],"appreciation":"七夕仰望碧霄，写牛郎织女渡河相会，又写家家户户穿针乞巧。以天上传说映人间习俗，语浅而意趣盎然，写出节日里的天真祈愿。","terms":[],"festivals":["七夕节"],"theme":"节·七夕"},{"title":"中秋月","author":"宋 · 苏轼","content":["暮云收尽溢清寒，","银汉无声转玉盘。","此生此夜不长好，","明月明年何处看。"],"appreciation":"“暮云收尽溢清寒，银汉无声转玉盘”写中秋月色的清冷圆满；后二句“此生此夜不长好，明月明年何处看”由眼前之月生出聚散无常之慨，欢愉中含怅惘，情味深长。","terms":[],"festivals":["中秋节"],"theme":"节·中秋"},{"title":"九月九日忆山东兄弟","author":"唐 · 王维","content":["独在异乡为异客，","每逢佳节倍思亲。","遥知兄弟登高处，","遍插茱萸少一人。"],"appreciation":"“独在异乡为异客，每逢佳节倍思亲”直抒思乡之情；后两句遥想兄弟登高插茱萸而独少一人，从对面着笔，把思念写得更深更切。","terms":[],"festivals":["重阳节"],"theme":"节·重阳"},{"title":"除夜作","author":"唐 · 高适","content":["旅馆寒灯独不眠，","客心何事转凄然。","故乡今夜思千里，","霜鬓明朝又一年。"],"appreciation":"客中逢除夕，寒灯独坐，“客心何事转凄然”一问自照；末联“故乡今夜思千里，霜鬓明朝又一年”从对面着笔写家人念远，又将岁末添岁之慨并入，羁旅之悲与流光之叹交织。","terms":[],"festivals":["除夕"],"theme":"节·除夕"},{"title":"除夜","author":"宋 · 陆游","content":["守岁全家夜不眠，","杯盘狼藉向灯前。","相看更觉光阴速，","笑语逡巡即隔年。"],"appreciation":"写除夕全家守岁、夜不能眠，杯盘狼藉，灯前相对；不写爆竹桃符的热闹，只取家常灯下的团圆之乐，语言朴素，情味温厚。","terms":[],"festivals":["除夕"],"theme":"节·除夕"}];

let currentDate = new Date();

function formatDate(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

function setPoem(p){
  document.getElementById('poemTitle').textContent = p.title;
  document.getElementById('poemAuthor').textContent = p.author;
  document.getElementById('poemContent').innerHTML = p.content.map(function(line){ return '<p>'+line+'</p>'; }).join('');
  document.getElementById('poemAppreciation').textContent = p.appreciation;
}

function renderTermTable(y){
  const el = document.getElementById('termTable'); if(!el) return;
  const arr = TERM_DATA[y]; if(!arr){ el.innerHTML=''; return; }
  const cur = currentTerm(currentDate);
  el.innerHTML = TERM_NAMES.map(function(t,i){
    const mmdd = arr[i]||''; const mm=mmdd.slice(0,2), dd=mmdd.slice(2);
    const dtxt = mm ? (parseInt(mm)+'月'+parseInt(dd)+'日') : '';
    const cls = (t===cur) ? 'term-cell cur' : 'term-cell';
    return '<div class="'+cls+'"><div class="tc-name">'+t+'</div><div class="tc-date">'+dtxt+'</div></div>';
  }).join('');
  const tt = document.getElementById('termTableTitle'); if(tt) tt.textContent = y+'年 · 歲時節氣表';
}

function renderCalendar(){
  const d = currentDate;
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  document.getElementById('dateDay').textContent = day;
  document.getElementById('dateMonthYear').textContent = y+'年'+m+'月';
  document.getElementById('lunarDate').textContent = lunarText(d);

  const term = getSolarTerm(d);
  const fests = getFestival(d);
  document.getElementById('solarTerm').textContent = term || (fests[0] || "日常");
  document.getElementById('festival').textContent = fests.length ? fests.join(' · ') : "";

  // 主诗：节日诗优先，其次当日/近日节气诗
  const cur = currentTerm(d);
  const pool = poemsOfTerm(cur);
  const fp = poemsOfFest(fests);
  let main = null;
  if(fp.length) main = fp[0];
  else if(term && pool.length) main = pool[day % pool.length];
  else if(pool.length) main = pool[(day-1) % pool.length];
  if(!main) main = poemDB[0];
  setPoem(main);

  document.getElementById('datePicker').value = formatDate(d);

  // 主题色
  const season = TERM_SEASON[cur] || "冬";
  const colors = {"春":"#2E6B4F","夏":"#8B3A2F","秋":"#b8860b","冬":"#3F6680"};
  document.getElementById('calendarHeader').style.background = 'linear-gradient(135deg, '+colors[season]+', '+colors[season]+'cc)';

  // 节气双璧
  document.getElementById('seasonTitle').textContent = cur + ' · 節氣雙璧';
  const grid = pool.length ? pool : poemDB.filter(function(p){ return p.theme && p.theme.indexOf(season)>=0; });
  document.getElementById('seasonGrid').innerHTML = grid.map(function(p){
    return '<div class="poem-card" onclick="showPoem(\''+p.title+'\')">'
      + '<div class="poem-card-title">'+p.title+'</div>'
      + '<div class="poem-card-author">'+p.author+'</div>'
      + '<div class="poem-card-preview">'+p.content[0]+(p.content[1]||'')+'</div>'
      + '<span class="theme-tag">'+p.theme+'</span></div>';
  }).join('');

  renderTermTable(y);
}

function showPoem(title){
  const p = poemDB.find(function(x){ return x.title===title; });
  if(p){ setPoem(p); window.scrollTo({top:0, behavior:'smooth'}); }
}
function changeDay(delta){ currentDate.setDate(currentDate.getDate()+delta); renderCalendar(); }
function pickDate(val){ if(val){ currentDate = new Date(val+'T12:00:00'); renderCalendar(); } }
function goToday(){ currentDate = new Date(); renderCalendar(); }

renderCalendar();
</script>

<div class="back-to-top" id="backToTop">歸</div>
<div class="idle-seal" onclick="togglePetals()" title="点此开/关落花">閑章</div>
<div class="colophon">诗藏本体论 · 岁在丙午 · 辑于西泠</div>
<script>
window.addEventListener('scroll', ()=>{
  const btn = document.getElementById('backToTop');
  if(btn) btn.classList.toggle('show', window.scrollY>300);
});
document.addEventListener('click', (e)=>{
  if(e.target.id === 'backToTop') window.scrollTo({top:0,behavior:'smooth'});
});
let petalsOn = localStorage.getItem('petals')==='true';
let petalTimer = null;
function togglePetals(){
  petalsOn = !petalsOn;
  localStorage.setItem('petals', petalsOn);
  petalsOn ? startPetals() : stopPetals();
}
function startPetals(){
  if(petalTimer) return;
  petalTimer = setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*7) + 's';
    const s = 6 + Math.random()*8;
    p.style.width = p.style.height = s + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 15000);
  }, 700);
}
function stopPetals(){
  clearInterval(petalTimer);
  petalTimer = null;
}
if(petalsOn) startPetals();
// 夜读模式兼容
document.querySelectorAll('.night-btn, [onclick*="night"]').forEach(btn=>{
  btn.addEventListener('click', ()=>document.body.classList.toggle('night'));
});
// 卷轴入场
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelector('.container, .main, .content')?.classList.add('scroll-unfold');
});
</script>

(function(){
  var btn=document.getElementById('shicangMenuBtn'),menu=document.getElementById('shicangMobileMenu');
  if(btn&&menu){
    btn.addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('open');});

      if(!menu.contains(e.target)&&e.target!==btn)menu.classList.remove('open');
    });

})();
