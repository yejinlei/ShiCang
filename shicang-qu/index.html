<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>曲林精读 · 诗藏本体论</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4efe0 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="2"/><feColorMatrix values="0 0 0 0 0.6 0 0 0 0 0.45 0 0 0 0 0.25 0 0 0 0.08 0"/></filter><rect width="200" height="200" filter="url(%23n)"/></svg>');font-family:"Noto Serif SC","STSong","SimSun",serif;color:#2c1810;min-height:100vh}
.top{max-width:1400px;margin:0 auto;padding:24px 28px;border-bottom:1px solid #d4c5a0}
.top h1{font-size:32px;font-weight:900;color:#2c1810;letter-spacing:4px}
.top h1 span{color:#8B3A2F;margin:0 12px;font-family:"Ma Shan Zheng",serif}
.top .sub{color:#6b5d48;margin-top:6px;font-size:14px;letter-spacing:1px}
.controls{max-width:1400px;margin:0 auto;padding:14px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e4d8c0;background:rgba(255,250,235,.5)}
.controls input{border:1px solid #c9b896;border-radius:4px;padding:8px 12px;background:#fdfaf2;font-family:inherit;font-size:14px;width:260px;color:#2c1810}
.controls .tag{padding:4px 12px;border:1px solid #c9b896;border-radius:16px;background:#fdfaf2;cursor:pointer;font-size:13px;color:#6b5d48;transition:all .2s}
.controls .tag.active{background:#5A4A7A;color:#fff;border-color:#5A4A7A}
.controls .back{padding:6px 16px;background:#8B3A2F;color:#fdf6e3;border-radius:4px;text-decoration:none;font-size:14px;margin-left:auto}
.main{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 28px}
.book-list{background:#fdf6e3;border:1px solid #d4c5a0;border-radius:6px;padding:16px;max-height:calc(100vh - 200px);overflow-y:auto}
.book-list h3{font-size:15px;color:#8B3A2F;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #e4d8c0}
.book-list .book-item{padding:8px 10px;margin:3px 0;border-radius:4px;cursor:pointer;font-size:13px;color:#4a3828;transition:all .2s;display:flex;justify-content:space-between}
.book-list .book-item:hover{background:#f4ead0}
.book-list .book-item.active{background:#5A4A7A;color:#fff}
.book-list .book-item .cnt{color:#8B3A2F;font-size:12px}
.book-list .book-item.active .cnt{color:#f4d8a8}
.content{min-height:400px}
.poem-card{background:#fdf6e3;border:1px solid #d4c5a0;border-radius:6px;padding:20px 24px;margin-bottom:16px;position:relative}
.poem-card::after{content:"曲";position:absolute;top:10px;right:14px;font-family:"Ma Shan Zheng",serif;color:#c0a878;font-size:20px;opacity:.4}
.poem-card .title{font-size:18px;color:#5A4A7A;font-weight:600;margin-bottom:4px}
.poem-card .meta{font-size:12px;color:#8a7560;margin-bottom:14px}
.poem-card .text{font-size:17px;line-height:2.2;color:#2c1810;letter-spacing:1px}
.poem-card .rhyme{color:#5A4A7A;font-weight:600;border-bottom:2px solid #d8c8e8}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,24,16,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#f6efe0;border:2px solid #c9a878;border-radius:8px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;padding:32px 40px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal::before{content:"";position:absolute;top:12px;right:16px;width:48px;height:48px;background:#8B3A2F;color:#fdf6e3;font-family:"Ma Shan Zheng",serif;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:4px;opacity:.85}
.modal h2{font-size:28px;color:#5A4A7A;margin-bottom:6px;letter-spacing:2px}
.modal .info{color:#8a7560;font-size:13px;margin-bottom:20px;border-bottom:1px solid #d4c5a0;padding-bottom:12px}
.modal .grid{display:grid;grid-template-columns:1fr;gap:12px}
.modal .line{font-size:20px;line-height:2.4;letter-spacing:2px;position:relative;padding-left:0}
.modal .line .ch{display:inline-block;text-align:center;position:relative;margin:0 1px}
.modal .line .ch .py{font-size:10px;color:#8a7560;display:block;line-height:1}
.modal .line .ch .tone{font-size:9px;color:#b08a4c;display:block;line-height:1.2}
.modal .line .ch .ze{color:#5A4A7A}
.modal .line .ch .rh{border-bottom:2px solid #8B3A2F;padding-bottom:1px}
.modal .section{margin-top:24px;padding-top:16px;border-top:1px dashed #d4c5a0}
.modal .section h4{color:#8B3A2F;font-size:15px;margin-bottom:10px;letter-spacing:1px}
.modal .section p{font-size:15px;line-height:1.9;color:#3c2818}
.close{position:absolute;top:12px;right:70px;background:none;border:none;font-size:24px;cursor:pointer;color:#8B3A2F}
.pager{display:flex;justify-content:center;gap:10px;padding:16px 0}
.pager button{padding:6px 16px;border:1px solid #c9b896;background:#fdf6e3;border-radius:4px;cursor:pointer;font-family:inherit;color:#4a3828}
.pager button:disabled{opacity:.4}
.pager span{padding:6px 12px;color:#6b5d48;font-size:14px}
@media(max-width:900px){.main{grid-template-columns:1fr}.book-list{max-height:300px}}
</style>

<div class="top">
  <h1>曲<span>·</span>林精读</h1>
  <div class="sub">北曲南戏 · 中原音韵 · 482 首元曲精读</div>
</div>
<div class="controls">
  <a href="../index.html" class="back">← 返回诗藏</a>
  <input type="text" id="search" placeholder="搜索曲牌 / 正文 / 出处...">
</div>
<div class="main">
  <div class="book-list" id="bookList"></div>
  <div class="content">
    <div id="listArea"></div>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageInfo"></span>
      <button id="next">下一页</button>
    </div>
  </div>
</div>

  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="qu_data.js"></script>
<script src="../shicang-jingdu/chartab_full.js"></script>
<script>
const byBook = QU_DATA.byBook;
const works = QU_DATA.works;
const charTab = window.SC_CHARTAB || {};
let curBook = 'all', page = 1, pageSize = 20;
const bookNames = Object.keys(byBook).sort((a,b)=>(byBook[b]?.length||0)-(byBook[a]?.length||0));

function renderBookList(){
  let html = '<h3>曲集（150部）</h3><div class="book-item '+(curBook==='all'?'active':'')+'" onclick="selBook(\'all\')">全部 <span class="cnt">'+works.length+'</span></div>';
  bookNames.forEach(b=>{
    html += '<div class="book-item '+(curBook===b?'active':'')+'" onclick="selBook(\''+b.replace(/'/g,"\\'")+'\')">'+b+' <span class="cnt">'+byBook[b].length+'</span></div>';
  });
  document.getElementById('bookList').innerHTML = html;
}
function getFiltered(){
  let list = curBook==='all' ? works : byBook[curBook]||[];
  const q = document.getElementById('search').value.trim();
  if(q) list = list.filter(w=>(w.qupai||'').includes(q)||(w.text||'').includes(q)||(w.source||'').includes(q));
  return list;
}
function render(){
  const list = getFiltered();
  const total = Math.ceil(list.length/pageSize);
  if(page>total) page=total; if(page<1) page=1;
  const items = list.slice((page-1)*pageSize, page*pageSize);
  let html = '';
  items.forEach((w,i)=>{
    const idx = (page-1)*pageSize+i;
    const textDisp = (w.text||'').slice(0,80) + ((w.text||'').length>80?'…':'');
    html += '<div class="poem-card" onclick="openQu('+idx+')">' +
      '<div class="title">【'+(w.qupai||'?')+'】'+(w.subtitle||'')+'</div>'+
      '<div class="meta">'+ (w.source||'') + ' · '+(w.chars||0)+'字 · 韵脚：'+(w.rhyme_chars||[]).join('、')+'</div>'+
      '<div class="text">'+textDisp+'</div>'+
      '</div>';
  });
  if(!items.length) html = '<div class="poem-card"><div class="text" style="text-align:center;color:#8a7560;padding:30px">未找到匹配内容</div></div>';
  document.getElementById('listArea').innerHTML = html;
  document.getElementById('pageInfo').textContent = '第 '+page+' / '+Math.max(total,1)+' 页 · 共 '+list.length+' 首';
  document.getElementById('prev').disabled = page<=1;
  document.getElementById('next').disabled = page>=total;
}
function selBook(b){curBook=b;page=1;renderBookList();render();}
document.getElementById('search').addEventListener('input',()=>{page=1;render();});
document.getElementById('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};
document.getElementById('next').onclick=()=>{page++;render();window.scrollTo(0,0)};

function renderChar(ch){
  const info = charTab[ch]||{};
  const py = info.pinyin||'';
  const t = info.tone||'';
  const toneCls = t==='平'?'':'ze';
  return '<span class="ch"><span class="py">'+py+'</span>'+ch+'<span class="tone '+toneCls+'">'+t+'</span></span>';
}
function openQu(idx){
  const list = getFiltered();
  const w = list[idx];
  if(!w) return;
  const rhymeSet = new Set(w.rhyme_chars||[]);
  let linesHtml = '';
  (w.lines||[]).forEach(line=>{
    line = line.replace(/[，。、；！？]/g,'');
    let lineHtml = '';
    for(const ch of line){
      const isRh = rhymeSet.has(ch);
      const info = charTab[ch]||{};
      const py = info.pinyin||'';
      const t = info.tone||'';
      const toneCls = t==='平'?'':'ze';
      lineHtml += '<span class="ch'+(isRh?' rh':'')+'"><span class="py">'+py+'</span>'+ch+'<span class="tone '+toneCls+'">'+t+'</span></span>';
    }
    linesHtml += '<div class="line">'+lineHtml+'</div>';
  });
  const html = '<h2>【'+w.qupai+'】'+(w.subtitle||'')+'</h2>'+
    '<div class="info">出处：'+w.source+' · '+w.chars+'字 · '+w.slabs+'片 · 格律匹配度 '+(w.meter_score*100).toFixed(0)+'%</div>'+
    '<div class="grid">'+linesHtml+'</div>'+
    '<div class="section"><h4>曲式说明</h4><p>此为'+w.qupai+'体，'+(w.chars)+'字，'+(w.rhyme_chars||[]).length+'个韵位，北曲多用中原音韵，平仄通押。</p></div>';
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderBookList();render();
</script>
</body>
