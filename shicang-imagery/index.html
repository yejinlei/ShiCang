<header>
  <a class="back" href="../index.html">← 返回诗藏</a>
  <h1>意象关系图</h1>
  <div class="subtitle">Imagery Network · 意象 · 情感 · 作品 · 诗人</div>
</header>
<div class="controls">
  <span style="color:#8B5A2B;font-size:13px;letter-spacing:2px">节点类型：</span>
  <button class="filter-btn active" data-type="all">全部</button>
  <button class="filter-btn" data-type="imagery">意象</button>
  <button class="filter-btn" data-type="emotion">情感</button>
  <button class="filter-btn" data-type="work">作品</button>
  <button class="filter-btn" data-type="poet">诗人</button>
  <span style="margin-left:20px"></span>
  <input class="search-box" id="searchBox" placeholder="搜索意象/诗人/作品…"/>
</div>
<div id="graph-container">
  <svg id="graph" height="720"></svg>
  <div class="tooltip" id="tooltip"></div>
</div>
<div class="legend">
  <div class="lg-item"><div class="lg-dot" style="background:#C9A96E"></div>意象</div>
  <div class="lg-item"><div class="lg-dot" style="background:#C0392B"></div>情感</div>
  <div class="lg-item"><div class="lg-dot" style="background:#2E7D32"></div>作品</div>
  <div class="lg-item"><div class="lg-dot" style="background:#8B3A2F"></div>诗人</div>
</div>
<footer>诗藏本体论 · 拖动节点可调整布局 · 点击节点查看详情</footer>
<script>
const data=IMAGERY_DATA;
const svg=d3.select("#graph"),container=document.getElementById("graph-container");
const width=container.clientWidth-40,height=720;
svg.attr("viewBox",[0,0,width,height]);
const tooltip=document.getElementById("tooltip");

const nodeColors={imagery:d=>d.color||"#C9A96E",emotion:"#C0392B",work:"#2E7D32",poet:"#8B3A2F"};
const linkColors={evokes:"#C0392B",usedIn:"#2E7D32",authored:"#8B3A2F"};

let filterType="all";
let searchTerm="";

function getVisible(){
  const showNode=n=>{
    if(filterType!=="all"&&n.type!==filterType)return false;
    if(searchTerm&&!n.id.includes(searchTerm))return false;
    return true;
  };
  const vis=new Set();
  data.nodes.forEach(n=>{if(showNode(n))vis.add(n.id)});
  // 保留一级邻居
  data.links.forEach(l=>{
    if(vis.has(l.source)||vis.has(l.target)){vis.add(l.source);vis.add(l.target)}
  });
  const nodes=data.nodes.filter(n=>vis.has(n.id));
  const nodeIds=new Set(nodes.map(n=>n.id));
  const links=data.links.filter(l=>nodeIds.has(l.source)&&nodeIds.has(l.target));
  return{nodes,links};
}

function render(){
  svg.selectAll("*").remove();
  const{nodes:nodes,links:links}=getVisible();
  
  // copy to add index
  const simNodes=nodes.map(d=>({...d}));
  const simLinks=links.map(d=>({...d}));

  const link=svg.append("g").selectAll("line").data(simLinks).join("line")
    .attr("class","link")
    .attr("stroke",d=>linkColors[d.type]||"#999")
    .attr("stroke-width",d=>d.type==="evokes"?1.2:d.type==="authored"?1.5:1);

  const node=svg.append("g").selectAll("g").data(simNodes).join("g")
    .attr("class","node")
    .call(d3.drag()
      .on("start",(event,d)=>{if(!event.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(event,d)=>{d.fx=event.x;d.fy=event.y})
      .on("end",(event,d)=>{if(!event.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  node.append("circle")
    .attr("r",d=>Math.max(4,Math.min(d.size||6,16)))
    .attr("fill",d=>typeof nodeColors[d.type]==="function"?nodeColors[d.type](d):nodeColors[d.type])
    .attr("stroke",d=>d.type==="imagery"?"#8B5A2B":"#fff")
    .attr("stroke-width",d=>d.type==="imagery"?2:1.5)
    .attr("fill-opacity",.85);

  node.append("text")
    .text(d=>d.id)
    .attr("x",0).attr("y",d=>-Math.max(4,Math.min(d.size||6,16))-4)
    .attr("text-anchor","middle")
    .attr("font-size",d=>d.type==="poet"||d.type==="imagery"?"14px":"11px")
    .attr("fill",d=>d.type==="poet"?"#8B3A2F":"#3c2820");

  node.on("mouseover",(ev,d)=>{
    let html=`<div class="tt-title">${d.id}</div>`;
    const orig=data.imagery_detail[d.id];
    if(orig){
      html+=`<div class="tt-row"><span class="tt-label">类　　别：</span>${orig.category}</div>`;
      html+=`<div class="tt-row"><span class="tt-label">关联情感：</span>${orig.emotions.join(" · ")}</div>`;
      html+=`<div class="tt-row"><span class="tt-label">名篇引用：</span>${orig.works.slice(0,6).join("、")}</div>`;
    }else if(d.type==="emotion"){
      html+=`<div class="tt-row"><span class="tt-label">情感类型</span></div>`;
    }else if(d.type==="poet"){
      html+=`<div class="tt-row"><span class="tt-label">诗　　人</span></div>`;
    }else if(d.type==="work"){
      html+=`<div class="tt-row"><span class="tt-label">诗 词 作 品</span></div>`;
    }
    tooltip.innerHTML=html;
    tooltip.classList.add("visible");
  }).on("mousemove",ev=>{
    const rect=container.getBoundingClientRect();
    tooltip.style.left=(ev.clientX-rect.left+12)+"px";
    tooltip.style.top=(ev.clientY-rect.top-10)+"px";
  }).on("mouseout",()=>{tooltip.classList.remove("visible")});

  const sim=d3.forceSimulation(simNodes)
    .force("link",d3.forceLink(simLinks).id(d=>d.id).distance(d=>d.type==="authored"?60:50).strength(.4))
    .force("charge",d3.forceManyBody().strength(-120))
    .force("center",d3.forceCenter(width/2,height/2))
    .force("collide",d3.forceCollide().radius(d=>Math.max(4,Math.min(d.size||6,16))+12))
    .on("tick",()=>{
      link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      node.attr("transform",d=>`translate(${d.x},${d.y})`);
    });
}

document.querySelectorAll(".filter-btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    filterType=b.dataset.type;
    render();
  };
});
document.getElementById("searchBox").oninput=e=>{
  searchTerm=e.target.value.trim();
  render();
};

// 响应式
window.addEventListener("resize",()=>{
  const w=container.clientWidth-40;
  svg.attr("viewBox",[0,0,w,height]);
  render();
});
render();
</script>
<script src="/ShiCang/shicang-assets/js/romantic.js"></script>

<div class="back-to-top" id="backToTop">歸</div>
<div class="idle-seal" onclick="togglePetals()" title="点此开/关落花">閑章</div>
<div class="colophon">诗藏本体论 · 岁在丙午 · 辑于西泠</div>
<script>
window.addEventListener('scroll', ()=>{
  document.getElementById('backToTop').classList.toggle('show', window.scrollY>300);
});
document.getElementById('backToTop').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
let petalsOn = localStorage.getItem('petals')==='true';
let petalTimer;
function togglePetals(){
  petalsOn=!petalsOn; localStorage.setItem('petals',petalsOn);
  petalsOn?startPetals():stopPetals();
}
function startPetals(){
  if(petalTimer)return;
  petalTimer=setInterval(()=>{
    const p=document.createElement('div');p.className='petal';
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(7+Math.random()*7)+'s';
    const s=6+Math.random()*8;p.style.width=p.style.height=s+'px';
    document.body.appendChild(p);setTimeout(()=>p.remove(),15000);
  },700);
}
function stopPetals(){clearInterval(petalTimer);petalTimer=null;}
if(petalsOn)startPetals();
// 夜读模式兼容
document.querySelectorAll('[class*=night]').forEach(btn=>{
  btn.addEventListener('click',()=>document.body.classList.toggle('night'));
});
</script>
