<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>诗藏精读库 · 诗藏</title>
<style>
:root{
  --paper:#f6efe0; --paper2:#fbf7ec; --ink:#2b2318; --ink2:#5c5346;
  --zhu:#8b3a2f; --zhu2:#b5503f; --line:#d9cbb1; --gold:#a8862f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  line-height:1.9;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(180,150,100,.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(140,110,70,.05), transparent 45%);
}
a{color:var(--zhu);text-decoration:none}
header.top{
  position:sticky; top:0; z-index:20;
  background:rgba(246,239,224,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 18px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
header.top .back{font-size:14px;color:var(--ink2)}
header.top h1{
  font-size:20px;margin:0;letter-spacing:.18em;color:var(--zhu);
  font-weight:600;
}
header.top .sub{font-size:12.5px;color:var(--ink2);letter-spacing:.05em}
header.top .spacer{flex:1}
header.top .stat{font-size:12.5px;color:var(--ink2)}
.layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 56px)}
aside.books{
  width:270px;flex:0 0 270px;border-right:1px solid var(--line);
  height:calc(100vh - 56px);overflow:auto;padding:12px 8px 40px;
  position:sticky;top:56px;
}
aside.books .cat{font-size:12px;color:var(--gold);letter-spacing:.2em;margin:12px 8px 6px}
aside.books .bk{
  display:flex;justify-content:space-between;gap:8px;
  padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px;
  color:var(--ink2);
}
aside.books .bk:hover{background:rgba(139,58,47,.07)}
aside.books .bk.on{background:rgba(139,58,47,.12);color:var(--zhu);font-weight:600}
aside.books .bk .n{font-size:11.5px;color:#9a8f7c}
main.body{flex:1;min-width:0;padding:16px 26px 80px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{
  flex:1;min-width:220px;padding:9px 14px;border:1px solid var(--line);
  border-radius:22px;background:var(--paper2);font-family:inherit;font-size:14px;
  color:var(--ink);outline:none;
}
.tools input:focus{border-color:var(--zhu2)}
.tools .hint{font-size:12.5px;color:#9a8f7c}
.bookhead{margin:6px 0 14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.bookhead h2{margin:0 0 4px;font-size:22px;color:var(--zhu);letter-spacing:.08em}
.bookhead .m{font-size:13px;color:var(--ink2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{
  border:1px solid var(--line);border-radius:8px;background:var(--paper2);
  padding:10px 14px;cursor:pointer;transition:.18s;
}
.card:hover{border-color:var(--zhu2);box-shadow:0 3px 12px rgba(139,58,47,.10)}
.card .ct{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.card .cl{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cg{font-size:11.5px;color:var(--gold);margin-top:3px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:18px 0;font-size:13.5px;color:var(--ink2)}
.pager button{
  border:1px solid var(--line);background:var(--paper2);border-radius:18px;
  padding:5px 14px;font-family:inherit;cursor:pointer;color:var(--ink2);
}
.pager button:disabled{opacity:.4;cursor:default}
/* 精读弹层 */
.veil{position:fixed;inset:0;background:rgba(30,24,16,.45);display:none;z-index:40}
.veil.on{display:block}
.reader{
  position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(760px,94vw);max-height:88vh;overflow:auto;
  background:var(--paper);
  border:1px solid #c9b898;border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  padding:26px 30px 34px;display:none;
}
.reader.on{display:block}
.reader .rh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.reader .rh h3{margin:0;font-size:22px;color:var(--zhu);letter-spacing:.08em}
.reader .rh .meta{font-size:12.5px;color:var(--ink2)}
.reader .rh .x{margin-left:auto;cursor:pointer;color:var(--ink2);font-size:22px;line-height:1}
.poem{margin:6px 0 18px}
.pl{white-space:nowrap;margin:0 0 2px;text-align:center}
.ch{display:inline-block;position:relative;padding:16px 3px 16px;font-size:26px;line-height:1.2}
.ch .py{position:absolute;top:0;left:0;right:0;font-size:10.5px;color:#8a7f6a;font-family:system-ui,sans-serif;text-align:center;letter-spacing:0}
.ch .pz{position:absolute;bottom:0;left:0;right:0;font-size:10.5px;color:#a89878;text-align:center}
.ch.rh .zi{color:var(--zhu);font-weight:600}
.ch.rh::after{
  content:"";position:absolute;left:50%;bottom:2px;width:7px;height:7px;
  margin-left:-3.5px;border-radius:50%;background:var(--zhu2);opacity:.75;
}
.ch .zi{position:relative}
.ch .zi.rare{color:#9c5a2e}
.ch.rh .py{color:#9a6a5a}
.rz{
  background:rgba(139,58,47,.06);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;font-size:13.5px;color:var(--ink2);margin-bottom:12px;
}
.rz b{color:var(--zhu)}
.segs{font-size:12.5px;color:#8a7f6a;text-align:center;letter-spacing:.05em}
.nores{color:#9a8f7c;font-size:14px;padding:30px 0;text-align:center}
@media(max-width:820px){
  aside.books{display:none}
  main.body{padding:14px 14px 60px}
  .ch{font-size:22px;padding:15px 2px}
}
</style>

<header class="top">
  <a class="back" href="../index.html">← 返回诗藏</a>
  <h1>诗藏精读库</h1>
  <span class="sub">唐诗文 · 逐字注音 · 平仄韵脚 · 句式精读</span>
  <span class="spacer"></span>
  <span class="stat" id="stat">加载中…</span>
</header>

<div class="layout">
  <aside class="books" id="booklist"></aside>
  <main class="body">
    <div class="tools">
      <input id="q" type="search" placeholder="在本集内检索诗题或诗句，如「明月」「送」"/>
      <span class="hint" id="qhint"></span>
    </div>
    <div class="bookhead" id="bhead"></div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="veil" id="veil"></div>
<div class="reader" id="reader"></div>

<script src="chartab.js"></script>
<script>
const DATA="../shicang_data/jingdu_lib/";
const IDX="../shicang_data/jingdu_lib_index.json";
let INDEX=null, CUR=null, WORKS=[], FILTERED=[], PAGE=1, PER=48;
const TAB=window.SC_CHARTAB||{};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function charHtml(ch, isRhyme){
  const info=TAB[ch]||"";
  const [py,pz]=info.split("|");
  const cls="ch"+(isRhyme?" rh":"");
  return `<span class="${cls}"><span class="py">${py||""}</span>`+
         `<span class="zi">${esc(ch)}</span>`+
         `<span class="pz">${pz||""}</span></span>`;
}

function renderWork(w){
  const unit=w.u, txt=w.l, rset=new Set(w.r||[]);
  const lines=[];
  for(let i=0;i<txt.length;i+=unit) lines.push(txt.substr(i,unit));
  let poem="";
  lines.forEach((ln,li)=>{
    const isRh=rset.has(li+1);
    let inner="";
    for(const ch of ln){
      const last=(ln[ln.length-1]===ch);
      inner+=charHtml(ch, isRh && last);
    }
    const grp = unit===5?"2/3":(unit===7?"2/2/3":"");
    poem+=`<div class="pl">${inner}</div>`;
  });
  const seg = unit===5?"五言":(unit===7?"七言":"");
  return `
    <div class="rh">
      <h3>${esc(w.t)}</h3>
      <span class="meta">${seg} · ${lines.length}句 · 韵部：<b>${esc(w.g||"未定")}</b>${w.ru?"（入声韵）":""}</span>
      <span class="x" onclick="closeReader()">×</span>
    </div>
    <div class="rz">
      <div><b>韵式</b>：${esc(w.d||"")}</div>
      <div>押韵句：${(w.r||[]).map(n=>"第"+n+"句").join("　")||"—"}</div>
    </div>
    <div class="poem">${poem}</div>
    <div class="segs">句式：每句${unit}字（${seg}，切分 ${unit===5?"2/3":"2/2/3"}）　·　韵脚朱圈为押韵字</div>
  `;
}

function openWork(i){
  const w=FILTERED[i];
  document.getElementById("reader").innerHTML=renderWork(w);
  document.getElementById("reader").classList.add("on");
  document.getElementById("veil").classList.add("on");
}
function closeReader(){
  document.getElementById("reader").classList.remove("on");
  document.getElementById("veil").classList.remove("on");
}
document.getElementById("veil").onclick=closeReader;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeReader();});

function renderList(){
  const el=document.getElementById("list");
  const total=FILTERED.length, pages=Math.max(1,Math.ceil(total/PER));
  if(PAGE>pages)PAGE=pages;
  const st=(PAGE-1)*PER, seg=FILTERED.slice(st,st+PER);
  if(!seg.length){el.innerHTML='<div class="nores">未找到匹配的诗作</div>';}
  else{
    el.innerHTML=seg.map((w,k)=>{
      const i=st+k;
      const preview=w.l.slice(0,22);
      return `<div class="card" onclick="openWork(${i})">
        <div class="ct">${esc(w.t)}</div>
        <div class="cl">${esc(preview)}…</div>
        <div class="cg">${w.u}言 · 韵：${esc(w.g||"—")}</div>
      </div>`;
    }).join("");
  }
  const pg=document.getElementById("pager");
  pg.innerHTML=`<button ${PAGE<=1?"disabled":""} onclick="go(${PAGE-1})">上一页</button>
    <span>第 ${PAGE} / ${pages} 页　共 ${total} 首</span>
    <button ${PAGE>=pages?"disabled":""} onclick="go(${PAGE+1})">下一页</button>`;
}
function go(p){PAGE=p;renderList();window.scrollTo({top:0,behavior:"smooth"});}

function applyFilter(){
  const q=document.getElementById("q").value.trim();
  FILTERED = q ? WORKS.filter(w=>w.t.includes(q)||w.l.includes(q)) :
                 WORKS.slice();
  PAGE=1;
  document.getElementById("qhint").textContent = q?`命中 ${FILTERED.length} 首`:"";
  renderList();
}
document.getElementById("q").addEventListener("input",()=>{
  clearTimeout(window._t);window._t=setTimeout(applyFilter,180);
});

async function openBook(slug){
  document.querySelectorAll("aside .bk").forEach(x=>{
    x.classList.toggle("on",x.dataset.slug===slug);
  });
  const r=await fetch(DATA+slug+".json");const d=await r.json();
  CUR=slug;WORKS=d.works||[];
  document.getElementById("bhead").innerHTML=
    `<h2>${esc(d.book)}</h2><div class="m">${esc(d.cat)} · 共 ${WORKS.length} 首精读</div>`;
  document.getElementById("q").value="";
  applyFilter();
}

async function init(){
  const r=await fetch(IDX);const idx=await r.json();
  INDEX=idx;
  document.getElementById("stat").textContent=
    `${idx.books.length} 部典籍 · ${idx.total.toLocaleString()} 首诗文`;
  const aside=document.getElementById("booklist");
  const cats={};
  idx.books.forEach(b=>(cats[b.cat]=cats[b.cat]||[]).push(b));
  let html="";
  for(const c in cats){
    html+=`<div class="cat">${c} · ${cats[c].length}部</div>`;
    cats[c].sort((a,b)=>b.count-a.count);
    html+=cats[c].map(b=>
      `<div class="bk" data-slug="${b.slug}" onclick="openBook('${b.slug}')">
        <span>${esc(b.book)}</span><span class="n">${b.count}</span></div>`).join("");
  }
  aside.innerHTML=html;
  const first=idx.books.slice().sort((a,b)=>b.count-a.count)[0];
  openBook(first.slug);
}
init();
</script>
</body>
