.head .sub .dot{margin:0 8px;opacity:.5;}

<script>
// 尝试从名家译本库匹配译文；匹配时忽略标点、空白和常见副标题前缀
function lookupMaster(author, title){
  if (!author || !title || !window.MASTER_TRANSLATIONS) return null;
  const norm = s => String(s).replace(/[\s·•·，。！？；：、,.!?;:）(（)）【】\[\]·\u3000]/g,'')
    .replace(/^[\(（].+?[\)）]/g,'')
    .replace(/(其一|其二|其三|其四|其五|其六|其七|其八|选录|节选|外一首|之一|之二)$/,'');
  const a = norm(author);
  // 精确匹配
  const t0 = norm(title);
  const k1 = a+'|'+t0;
  if (MASTER_TRANSLATIONS[k1]) return MASTER_TRANSLATIONS[k1];
  // 去掉词牌后试
  const t = t0.replace(/^(水调歌头|念奴娇|江城子|蝶恋花|定风波|声声慢|一剪梅|武陵春|永遇乐|青玉案|破阵子|雨霖铃|浣溪沙|虞美人|相见欢|浪淘沙令|鹊桥仙|钗头凤|满江红|渔家傲|临江仙|望江南|苏幕遮|菩萨蛮|渔歌子|八声甘州|桂枝香|望海潮|木兰花|采桑子|清平乐|鹧鸪天|踏莎行|摸鱼儿|贺新郎|卜算子|青玉案|阮郎归|点绛唇|长相思)/, '');
  const k2 = a+'|'+t;
  if (MASTER_TRANSLATIONS[k2]) return MASTER_TRANSLATIONS[k2];
  // 遍历所有key模糊匹配
  for (const k in MASTER_TRANSLATIONS){
    const [ka, kt] = k.split('|');
    if (ka === a && (kt.startsWith(t0) || t0.startsWith(kt) || kt.includes(t0.slice(0,4)))) return MASTER_TRANSLATIONS[k];
  }
  return null;
}

function attachTranslation(p){
  const m = lookupMaster(p.author, p.title) || lookupMaster(p.author, p.title+(p.subtitle||''));
  if (m){
    p.en_title = m.et;
    p.en_author = p.author;
    p.en_dynasty = p.dynasty || '';
    p.en_body = m.eb;
    p.en_translator = m.tr;
  } else {
    p.en_translator = '';
  }
}


const params = new URLSearchParams(location.search);
// 兼容三种入参：?anth=<key> 老链接 / ?s=<key>[_slug]&i=N 选本 / ?src=<id>&i=N 全集
let anthParam = params.get('anth') || '';
let sParam = params.get('s') || '';
const srcParam = params.get('src') || '';
const iParam = parseInt(params.get('i') || '0', 10);
// 当 s 不含下划线，说明是整个选本入口（首篇）；此时不预先拼 slug，直接从分片里取 i 首
let slug = (sParam && sParam.indexOf('_')>=0) ? sParam : '';
let aslug = (anthParam || (sParam && sParam.split('_')[0]) || '');
let CHAR = {}, POEMS = [], CUR = null, MODE = anthParam||sParam ? 'anth' : 'coll';

const ANTH_SLUG = {qianjiashi:'千家诗',songci300:'宋词三百首',jumiaohaoci:'绝妙好词',
  jin300:'近三百年名家词选',wanshou:'唐人万首绝句选',yuanshi:'元诗别裁集',
  mingshi:'明诗别裁集',qingshi:'清诗别裁集'};

function pick(ch){
  const raw = CHAR[ch];
  if(!raw) return null;
  if(typeof raw === 'object') return raw;
  // string format: "pinyin|tone|rhyme"
  const parts = String(raw).split('|');
  return { pinyin: parts[0]||'', tone: parts[1]||'', rhyme: parts[2]||'' };
}

// 将全本数据（{t,a,l,u,g,r,...}）归一化为 view 渲染所需格式 {title,author,dynasty,genre,body,subtitle}
function normalizeWork(w, meta){
  const title = w.t || w.title || '(无题)';
  const author = w.a || w.author || '';
  let body = [];
  if(Array.isArray(w.l)) body = w.l.filter(x=>x);
  else if(w.l) body = String(w.l).split(/(?<=[，。！？；：、])/);
  else if(w.text) {
    // 按句末标点断句
    const t = w.text.replace(/\s+/g,'');
    body = t.match(/[^，。！？；：、,.!?]+[，。！？；：、,.!?]?/g) || [t];
  }
  let genre = w.g || w.genre || meta.genre || '诗';
  if(w.cipai) genre='词';
  if(w.tune||w.qupai) genre='曲';
  const dynasty = w.dynasty || meta.dynasty || '';
  return {
    title, subtitle: w.subtitle || (w.cipai && w.title ? w.cipai : ''),
    author, dynasty, genre,
    body,
    main_a: meta.title,
    en_title: '', en_author: '', en_dynasty: '', en_body: [],
  };
}

function renderPoem(p){
  const poem = $('poem');
  const lines = (p.body || []).filter(x => x);
  const PUNC = /[，。！？；：、,.!?;:）)]/;
  const endChars = [];
  lines.forEach(line => {
    const cs = Array.from(line);
    for (let i = 0; i < cs.length - 1; i++){
      if (!PUNC.test(cs[i]) && PUNC.test(cs[i+1])) endChars.push(cs[i]);
    }
  });
  const rc = {};
  endChars.forEach(c => { const inf = pick(c); if (inf && inf.rhyme) rc[inf.rhyme] = (rc[inf.rhyme]||0)+1; });
  let mainRhyme = '', best = 0;
  for (const r in rc){ if (rc[r] > best){ best = rc[r]; mainRhyme = r; } }
  const rhymeOK = c => { const inf = pick(c); return best >= 2 && inf && inf.rhyme && inf.rhyme === mainRhyme; };
  let html = '';
  lines.forEach(line => {
    html += '<div class="pline"><span class="chline">';
    const chars = Array.from(line);
    for (let i = 0; i < chars.length; i++){
      const ch = chars[i];
      if (/[，。！？；：、,.!?;:）)]/.test(ch)){
        html += '<span class="ch"><span class="zi" style="color:#9a8560">' + ch + '</span></span>';
        continue;
      }
      const info = pick(ch) || {};
      const isEnd = i+1 < chars.length && /[，。！？；：、,.!?;:）)]/.test(chars[i+1]);
      const isR = isEnd && rhymeOK(ch);
      html += '<span class="ch' + (isR ? ' is-rhyme' : '') + '">'
        + (info.pinyin ? '<span class="py">' + info.pinyin + '</span>' : '')
        + '<span class="zi">' + ch + '</span>'
        + (info.tone ? '<span class="pz">' + info.tone + '</span>' : '')
        + '</span>';
    }
    html += '</span></div>';
  });
  poem.innerHTML = html;

  const enBox = $('enBox');
  if (p.en_body && p.en_body.some(x => x)){
    enBox.style.display = '';
    $('enTitle').textContent = p.en_title || p.title;
    const au = p.en_author && !/[\u4e00-\u9fff]/.test(p.en_author) ? p.en_author : '';
    $('enAuthor').textContent = (p.en_dynasty||'') + (au ? ' · ' + au : '');
    const elBox = $('enLines');
    elBox.innerHTML = p.en_body.map((e,i) => '<div class="en-line">' + (e||'&nbsp;') + '</div>').join('');
    $('enNote').textContent = p.en_translator ? ('Translated by ' + p.en_translator + ' · ' + p.en_translator + '译') : 'Translated by ShiCang · 诗藏自译';
  } else {
    enBox.style.display = 'none';
  }
}

function renderMeta(p){
  $('h1').textContent = p.title + (p.subtitle ? '　' + p.subtitle : '');
  $('sub').innerHTML = (p.dynasty||'') + (p.author?'<span class="dot">·</span>'+p.author:'') + '<span class="dot">·</span>' + (p.genre||'诗');
  const lab = MODE==='anth' ? (ANTH_SLUG[aslug] || p.main_a) : p.main_a;
  $('anth-name').textContent = '诗藏 · ' + lab;
  $('from').innerHTML = '选自《' + (p.main_a||lab) + '》';
  document.getElementById('seal').textContent = p.genre === '词' ? '詞' : (p.genre==='曲'?'曲':(p.genre==='辞'||p.genre==='赋'?'賦':(p.genre==='文'?'文':'詩')));
  if (p.note){
    $('note').style.display = 'block';
    $('note').innerHTML = '<span class="lab">選家評曰　</span>' + p.note;
  } else {
    $('note').style.display = 'none';
  }
  if (p.deep){
    $('deepbox').style.display = 'block';
    $('deepbox').innerHTML = '<a href="../shicang-poem/' + p.deep + '.html">展深度精读 · 今译赏析 →</a>';
  } else if (p.anthologies && p.anthologies.length > 1){
    $('deepbox').style.display = 'block';
    $('deepbox').innerHTML = '<span style="color:var(--gold);font-size:13px;">兼见：' + p.anthologies.slice(1).map(a=>'《'+a+'》').join('　') + '</span>';
  } else {
    $('deepbox').style.display = 'none';
  }
  document.title = p.title + ' · 名篇精读 · 诗藏';
}

function renderPN(idx){
  const box = $('pn');
  let html = '';
  if (MODE==='anth'){
    const prev = POEMS[idx-1], next = POEMS[idx+1];
    html += prev ? '<a href="view.html?s=' + prev.slug + '"><span>上一篇</span>' + (prev.title||'') + '</a>' : '<div class="ph"></div>';
    html += next ? '<a class="next" href="view.html?s=' + next.slug + '"><span>下一篇</span>' + (next.title||'') + '</a>' : '<div class="ph"></div>';
  } else {
    const prev = idx > 0 ? POEMS[idx-1] : null;
    const next = idx < POEMS.length-1 ? POEMS[idx+1] : null;
    const globalNext = iParam + 1;
    const globalPrev = iParam - 1;
    html += prev ? '<a href="view.html?src='+srcParam+'&i='+globalPrev+'"><span>上一篇</span>' + (prev.t||prev.title||'') + '</a>' : '<div class="ph"></div>';
    html += next ? '<a class="next" href="view.html?src='+srcParam+'&i='+globalNext+'"><span>下一篇</span>' + (next.t||next.title||'') + '</a>' : '<div class="ph"></div>';
    // 加上"返回目录"
    html += '<a class="back" href="index.html" style="position:absolute;left:26px;bottom:40px;font-size:13px;color:var(--ink3);text-decoration:none;border-bottom:1px dashed var(--ink3);">← 返回目录</a>';
    // 卷末提示
    if(!next){
      html += '<div style="position:absolute;right:26px;bottom:40px;font-size:12px;color:var(--ink3);">本卷已尽</div>';
    }
  }
  box.innerHTML = html;
}

document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
  b.classList.toggle('on');
  document.body.classList.toggle(b.dataset.opt);
});

// 加载全集数据
async function loadColl(){
  MODE='coll';
  // 读取 index.json 获取 volumes
  let idx;
  try{
    idx = await fetch('../shicang_data/jingdu_lib/'+srcParam+'_index.json').then(r=>r.json());
  }catch(e){
    $('poem').innerHTML = '<div class="loading">加 载 失 败</div>'; return;
  }
  const cat = await fetch('../shicang_data/jingdu/catalog.json').then(r=>r.json()).catch(()=>({collections:[]}));
  const meta = cat.collections.find(c=>c.id===srcParam) || {title:srcParam,dynasty:'',genre:'诗'};

  let vols = [];
  if (idx.volumes && Array.isArray(idx.volumes)){
    let off = 0;
    vols = idx.volumes.map(v => {
      if(typeof v==='string'){
        const o = {file:'../shicang_data/jingdu_lib/'+v, start:off, count:1000}; off += 1000; return o;
      }
      const cnt = v.count || 1000;
      const o = {file:'../shicang_data/jingdu_lib/'+(v.file||v.path||''), start:off, count:cnt, label:v.label||''};
      off += cnt;
      return o;
    });
  } else if (idx.category && Array.isArray(idx.category)){
    let off=0;
    for(const c of idx.category){
      if(c.file){ vols.push({file:'../shicang_data/jingdu_lib/'+c.file, start:off, count:c.count||1000}); off += c.count||1000; }
      else if(c.chapters){ for(const ch of c.chapters||[]){ if(ch.file){ vols.push({file:'../shicang_data/jingdu_lib/'+ch.file, start:off, count:ch.count||1000}); off += ch.count||1000;} } }
    }
  }
  if(vols.length===0){
    vols = [{file:'../shicang_data/jingdu_lib/'+srcParam+'.json', start:0, count:meta.count}];
  }

  // 定位卷
  let targetVol = vols[0], offset = 0, idxInVol = iParam;
  for(const v of vols){
    if(iParam < v.start + v.count){ targetVol = v; idxInVol = iParam - v.start; break; }
    offset = v.start + v.count;
  }
  try{
    const data = await fetch(targetVol.file).then(r=>r.json());
    POEMS = Array.isArray(data) ? data : (data.works||[]);
    const w = POEMS[idxInVol] || POEMS[0];
    CUR = normalizeWork(w, meta);
    CHAR = window.SC_CHARTAB || window.CHARTAB || {};
    attachTranslation(CUR);
    renderMeta(CUR);
    renderPoem(CUR);
    renderPN(idxInVol);
  }catch(e){
    $('poem').innerHTML = '<div class="loading">加 载 失 败</div>';
  }
}

function loadAnth(){
  MODE='anth';
  if(!aslug){
    $('poem').innerHTML = '<div class="loading">未指定选本</div>'; return;
  }
  Promise.all([
    fetch('../shicang_data/char_info.json').then(r => r.json()).catch(() => ({})),
    fetch('../shicang_data/mingpian/data_' + aslug + '.json').then(r => {
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    })
  ]).then(([chars, poems]) => {
    CHAR = chars; POEMS = poems;
    // 两种定位：有 slug 按 slug 找，没有则按 iParam
    let idx = -1;
    if(slug) idx = poems.findIndex(x => x.slug === slug);
    if(idx < 0) idx = Math.max(0, Math.min(iParam, poems.length-1));
    attachTranslation(CUR);
    if(idx < 0 || !poems[idx]){ $('poem').innerHTML = '<div class="loading">未 得 此 篇</div>'; return; }
    CUR = poems[idx];
    renderMeta(CUR);
    renderPoem(CUR);
    renderPN(idx);
  }).catch(e=>{
    $('poem').innerHTML = '<div class="loading">加 载 失 败：'+(e.message||'')+'</div>';
  });
}

// 启动
if(MODE==='anth'){
  loadAnth();
} else {
  loadColl();
}
