<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名篇精读 · 诗藏</title>
<link rel="stylesheet" href="../global.css">
<style>
body{background:#f7f1e3;color:#2a1f1a;font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;min-height:100vh;}
main{max-width:820px;margin:0 auto;padding:60px 24px 80px;}
.back-link{display:inline-block;margin-bottom:24px;color:#8b2f2f;text-decoration:none;border-bottom:1px dashed #8b2f2f;font-size:14px;padding-bottom:2px;}
.seal-badge{display:inline-block;background:#8b2f2f;color:#f7f1e3;font-size:12px;padding:3px 10px;border-radius:2px;margin-left:8px;vertical-align:middle;letter-spacing:2px;}
.work-title{font-size:34px;font-weight:700;text-align:center;margin:30px 0 12px;color:#1a100c;letter-spacing:3px;line-height:1.4;}
.work-sub{text-align:center;color:#8b6f5c;font-size:15px;margin-bottom:40px;letter-spacing:1px;}
.work-from{text-align:center;color:#a08873;font-size:13px;margin-bottom:30px;font-style:italic;}
#poem{font-size:22px;line-height:2.4;text-align:center;margin:30px 0 40px;color:#1a100c;}
.pline{margin:8px 0;}
.chline{display:inline-flex;flex-wrap:wrap;justify-content:center;}
.ch{display:inline-flex;flex-direction:column;align-items:center;margin:0 1px;position:relative;}
.ch .py{font-size:11px;color:#a08873;height:16px;line-height:16px;font-family:sans-serif;opacity:0;transition:opacity .2s;}
.ch .zi{font-size:22px;line-height:1.3;}
.ch .pz{font-size:10px;color:#8b2f2f;height:14px;line-height:14px;font-family:sans-serif;opacity:0;transition:opacity .2s;}
body.opt-py .ch .py{opacity:1;}
body.opt-pz .ch .pz{opacity:1;}
.ch.is-rhyme .zi{color:#8b2f2f;font-weight:600;}
.ch.is-rhyme::after{content:'韵';position:absolute;top:-3px;right:-6px;font-size:9px;color:#8b2f2f;font-family:sans-serif;}
body.opt-rhyme .ch.is-rhyme .zi{border-bottom:2px solid #8b2f2f;}
.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:30px 0;}
.sw{padding:6px 14px;border:1px solid #c4b09a;background:transparent;color:#5c4636;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit;}
.sw:hover{border-color:#8b2f2f;color:#8b2f2f;}
.sw.on{background:#8b2f2f;color:#f7f1e3;border-color:#8b2f2f;}
.en-box{max-width:700px;margin:20px auto;padding:20px 28px;background:rgba(139,47,47,.04);border-left:3px solid #8b2f2f;display:none;}
.en-title{font-size:18px;font-weight:600;margin-bottom:8px;color:#1a100c;}
.en-author{font-size:13px;color:#8b6f5c;margin-bottom:14px;}
.en-lines{font-size:15px;line-height:1.9;color:#3a2f2a;font-family:"Georgia",serif;}
.en-line{margin:6px 0;}
.en-note{margin-top:14px;padding-top:12px;border-top:1px dashed #c4b09a;font-size:12px;color:#8b6f5c;font-style:italic;}
body.opt-en .en-box{display:block;}
body.opt-vt #poem{writing-mode:vertical-rl;height:60vh;margin:0 auto;}
body.opt-vt .chline{flex-direction:row;}
body.opt-big #poem{font-size:28px;}
body.opt-big .ch .zi{font-size:28px;}
.deep-panels{max-width:820px;margin:40px auto 0;padding:28px 24px;border-top:2px solid #8b2f2f;position:relative;background:rgba(247,241,227,.6);}
.deep-panels::before{content:'精 读';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#8b2f2f;color:#f7f1e3;padding:2px 16px;font-size:13px;letter-spacing:4px;}
.deep-tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.deep-sw{padding:5px 14px;background:transparent;border:1px solid #d4c4af;color:#8b6f5c;font-size:13px;cursor:pointer;font-family:inherit;border-radius:3px;transition:all .2s;}
.deep-sw:hover{color:#8b2f2f;border-color:#8b2f2f;}
.deep-sw.on{background:#8b2f2f;color:#f7f1e3;border-color:#8b2f2f;}
.dp-panel{display:none;font-size:15px;line-height:2;color:#3a2f2a;padding:10px 0;}
.dp-panel.active{display:block;}
.dp-panel h4{margin:0 0 12px;font-size:17px;color:#8b2f2f;font-weight:600;letter-spacing:2px;border-bottom:1px solid #e5d9c6;padding-bottom:6px;}
.dp-note-item{margin:8px 0;font-size:14.5px;}
.dp-note-term{color:#8b2f2f;font-weight:600;margin-right:6px;}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.st-block{padding:10px 14px;background:rgba(139,47,47,.03);border-left:2px solid #c4b09a;}
.st-block b{display:block;color:#8b2f2f;font-size:14px;margin-bottom:4px;letter-spacing:2px;}
.st-block span{font-size:14px;line-height:1.8;color:#3a2f2a;}
.img-list{list-style:none;padding:0;margin:0;}
.img-list li{margin:8px 0;font-size:14.5px;}
.img-list li b{color:#8b2f2f;font-weight:600;margin-right:6px;}
.pn{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(247,241,227,.98),rgba(247,241,227,.8));padding:12px 24px;display:flex;justify-content:center;gap:20px;align-items:center;z-index:100;}
.pn a{color:#8b2f2f;text-decoration:none;padding:8px 20px;border:1px solid #c4b09a;border-radius:20px;font-size:14px;transition:all .2s;background:rgba(247,241,227,.9);}
.pn a:hover{background:#8b2f2f;color:#f7f1e3;border-color:#8b2f2f;}
.pn .ph{width:100px;}
.loading{text-align:center;padding:60px 20px;color:#8b6f5c;font-size:16px;letter-spacing:4px;}
@media(max-width:768px){
  .work-title{font-size:26px;}
  #poem{font-size:18px;}
  .ch .zi{font-size:18px;}
  .st-grid{grid-template-columns:1fr;}
}
</style>
</head>

<main>
  <a class="back-link" href="./">← 返回名篇精读</a>
  <h1 class="work-title" id="title">…</h1>
  <div class="work-sub" id="sub"></div>
  <div class="work-from" id="from"></div>
  <div class="toolbar">
    <button class="sw" data-opt="opt-py">注音</button>
    <button class="sw" data-opt="opt-pz">平仄</button>
    <button class="sw" data-opt="opt-rhyme">韵脚</button>

    <div class="en-title" id="enTitle"></div>

  <div class="deep-panels" id="panels" style="display:none">

      <button class="deep-sw on" data-dp="note">注释</button>

      <button class="deep-sw" data-dp="appr">赏析</button>
      <button class="deep-sw" data-dp="st">起承转合</button>
      <button class="deep-sw" data-dp="img">意象</button>
      <button class="deep-sw" data-dp="bg">背景</button>
      <button class="deep-sw" data-dp="theme">题旨</button>
    </div>
    <div class="dp-panel active" id="dp-note"></div>
    <div class="dp-panel" id="dp-tr"></div>
    <div class="dp-panel" id="dp-appr"></div>
    <div class="dp-panel" id="dp-st"></div>
    <div class="dp-panel" id="dp-img"></div>
    <div class="dp-panel" id="dp-bg"></div>
    <div class="dp-panel" id="dp-theme"></div>
  </div>
</main>
<div class="pn" id="pn"></div>

<script src="../romantic.js"></script>
<script src="chartab.js"></script>
<script src="translations.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const srcParam = params.get('src') || '';
  const sParam = params.get('s') || '';
  const deepParam = params.get('deep') || '';
  const anthParam = params.get('anth') || '';
  const iParam = parseInt(params.get('i') || '0', 10);
  const aslug = anthParam || (sParam && sParam.split('_')[0]) || '';
  const slug = (sParam && sParam.indexOf('_')>=0) ? sParam : '';
  const MODE = deepParam ? 'deep' : (aslug ? 'anth' : 'coll');

  const ANTH_NAME = {qianjiashi:'千家诗',songci300:'宋词三百首',jumiaohaoci:'绝妙好词',jin300:'近三百年名家词选',wanshou:'唐人万首绝句选',yuanshi:'元诗别裁集',mingshi:'明诗别裁集',qingshi:'清诗别裁集'};

  let CHAR = {}, POEMS = [], CUR = null, CUR_IDX = 0;

  // 工具栏开关
  document.querySelectorAll('.sw').forEach(btn => {
    btn.onclick = () => {
      btn.classList.toggle('on');
      document.body.classList.toggle(btn.dataset.opt, btn.classList.contains('on'));
    };
  });
  document.querySelectorAll('.deep-sw').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.deep-sw').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.dp-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('on');
      $(`dp-${btn.dataset.dp}`).classList.add('active');
    };
  });

  // 标准化作品对象（统一字段名）
  function normalize(w, meta){
    const title = (w.t || w.title || '(无题)').trim();
    const author = (w.a || w.author || '').trim();
    const dynasty = w.dynasty || meta.dynasty || '';
    let genre = w.g || w.genre || meta.genre || '诗';
    if(w.cipai) genre = '词';
    if(w.tune || w.qupai) genre = '曲';

    // 正文：兼容 lines/body/paragraphs/l/text
    const raw = w.lines || w.body || w.paragraphs || w.l || w.text;
    let body = [];
    if(Array.isArray(raw)){
      for(const it of raw){
        if(Array.isArray(it)){
          for(const l of it){ if(l && String(l).trim()) body.push(String(l).trim()); }
        } else if(it && String(it).trim()){
          const s = String(it).trim();
          // 按句末标点（。！？）切分成独立诗句，不要按逗号切
          if(s.length > 12 && /[。！？]/.test(s.slice(1))){
            // 中文/英文句号感叹号问号作为句末切分点，保留标点
            const parts = s.split(/(?<=[。！？!?])/);
            for(const pt of parts){ if(pt.trim()) body.push(pt.trim()); }
          } else {
            body.push(s);
          }
        }
      }
    } else if(raw){
      const s = String(raw).replace(/\s+/g,'');
      // 按句末标点切分，保留标点在句末；不要把逗号断句
      const parts = s.split(/(?<=[。！？!?])/).filter(x=>x && x.trim());
      body = parts.length >= 2 ? parts.map(x=>x.trim()).filter(Boolean) : [s];
    }

    // 注释
    let note = w.note || '';
    if(!note && Array.isArray(w.notes)){
      note = w.notes.map(n => {
        if(typeof n === 'string') return n;
        if(n && n.term){
          const exp = n.explanation || n.exp || n.desc || n.text || '';
          return `【${n.term}】${exp}`;
        }
        return '';
      }).filter(Boolean).join('\n');
    }
    // 今译
    let tr = w.tr || w.translation || '';
    tr = String(tr).replace(/^这首.{1,8}代.{1,20}的名作，.{0,100}是古典诗词中的佳作。?\s*/,'').trim();
    // 赏析
    let appr = w.appr || w.appreciation || '';
    if(appr && /作品以「.{2,20}」开篇.*意象串联/.test(appr) && appr.length < 300){
      appr = `《${title}》是${dynasty}代${author}所作的经典${genre}。以「${(w.incipit||body[0]||'').slice(0,10)}」起笔，语言凝练、意境深远，章法严谨、情景交融，为历代传诵之名篇。`;
    }
    // 起承转合
    let st = w.st || w.structure || '';
    if(Array.isArray(st)){
      st = st.map(s => {
        if(typeof s === 'string') return s;
        if(s && s.key && s.val) return `【${s.key}】${s.val}`;
        return '';
      }).filter(Boolean).join('\n');
    } else if(st && typeof st === 'string'){
      // 字符串型结构，按首/颔/颈/尾/起/承/转/合切分成块
      st = String(st);
    }
    // 意象
    let img = w.img || '';
    if(!img && Array.isArray(w.imagery)){
      img = w.imagery.map(m => {
        if(typeof m === 'string') return m;
        if(m && m.word && m.meaning) return `【${m.word}】${m.meaning}`;
        if(m && m.name && m.meaning) return `【${m.name}】${m.meaning}`;
        return '';
      }).filter(Boolean).join('\n');
    } else if(!img && typeof w.imagery === 'string'){
      img = w.imagery;
    }
    // 背景
    let bg = w.bg || w.background || '';
    // 题旨
    const theme = w.theme || '';
    // 英译
    let en_body = w.en_body || [];
    if(!en_body.length && w.en_translation) en_body = [w.en_translation];
    let en_note = w.en_translator || '';
    const has_real_en = en_body.some(x => x && /[a-zA-Z]{30,}/.test(x) && !x.startsWith('Translation of this piece') && !x.startsWith('此篇'));
    if(!has_real_en){
      en_body = ["Translation of this piece is being curated. Authoritative versions by renowned translators (e.g. Xu Yuanchong, Arthur Waley, Ezra Pound) will be added here when available. 此篇英译正在整理中，欢迎提供名家译本。"];
      en_note = '英译整理中 · Translation in Progress';
    } else if(!en_note){
      en_note = 'Translated by ShiCang · 诗藏自译';
    }

    return {
      title, author, dynasty, genre, body,
      note, tr, appr, st, img, bg, theme,
      en_body, en_note,
      slug: w.slug||'', incipit: w.incipit||'',
      main_a: meta.title||''
    };
  }

  // 查字
  function pick(ch){
    const r = CHAR[ch]; if(!r) return null;
    if(typeof r === 'object') return r;
    const parts = String(r).split('|');
    return {pinyin:parts[0]||'', tone:parts[1]||'', rhyme:parts[2]||''};
  }

  // 渲染正文
  function renderPoem(p){
    const endChars = [];
    let html = '';
    for(const line of p.body){
      html += '<div class="pline"><span class="chline">';
      const chars = Array.from(line);
      for(let i=0;i<chars.length;i++){
        const ch = chars[i];
        if(/[，。！？；：、,.!?;:）)（(]/.test(ch)){
          html += `<span class="ch"><span class="zi" style="color:#9a8560">${ch}</span></span>`;
          continue;
        }
        const info = pick(ch) || {};
        const isEnd = i+1<chars.length && /[，。！？；：、,.!?;:)）]/.test(chars[i+1]);
        if(isEnd) endChars.push(ch);
        const isR = isEnd && isRhyme(ch, endChars);
        html += `<span class="ch${isR?' is-rhyme':''}">${info.pinyin?`<span class="py">${info.pinyin}</span>`:''}<span class="zi">${ch}</span>${info.tone?`<span class="pz">${info.tone}</span>`:''}</span>`;
      }
      html += '</span></div>';
    }
    $('poem').innerHTML = html;
    // 英译
    const box = $('enBox');
    if(p.en_body && p.en_body.some(x=>x)){
      $('enTitle').textContent = p.title;
      $('enAuthor').textContent = p.dynasty + (p.author?' · '+p.author:'');
      $('enLines').innerHTML = p.en_body.map(e=>`<div class="en-line">${e||'&nbsp;'}</div>`).join('');
      $('enNote').textContent = p.en_note;
    }
  }

  function isRhyme(ch, endChars){
    const rc = {};
    endChars.forEach(c => { const inf = pick(c); if(inf && inf.rhyme) rc[inf.rhyme]=(rc[inf.rhyme]||0)+1; });
    let best=0, main='';
    for(const r in rc){ if(rc[r]>best){best=rc[r]; main=r;} }
    if(best<2) return false;
    const inf = pick(ch);
    return inf && inf.rhyme === main;
  }

  // 渲染元信息
  function renderMeta(p){
    document.title = p.title + ' · 名篇精读 · 诗藏';
    $('title').textContent = p.title;
    $('sub').innerHTML = (p.dynasty||'') + (p.author?'<span style="margin:0 6px;color:#c4b09a">·</span>'+p.author:'') + `<span class="seal-badge">${p.genre==='词'?'詞':(p.genre==='曲'?'曲':(p.genre==='辞'?'賦':(p.genre==='文'?'文':'詩')))}</span>`;
    $('from').textContent = p.main_a ? `选自《${p.main_a}》` : '';
  }

  // 渲染七项面板
  function renderPanels(p){
    const has = !!(p.note || p.tr || p.appr || p.st || p.img || p.bg || p.theme);
    if(!has){ $('panels').style.display='none'; return; }
    $('panels').style.display='block';
    // 注释
    $('dp-note').innerHTML = '<h4>注　释</h4>' + (p.note ? p.note.split('\n').map(l=>{
      const m = l.match(/^【(.+?)】(.*)$/);
      return m ? `<div class="dp-note-item"><span class="dp-note-term">${m[1]}</span>${m[2]}</div>` : `<div class="dp-note-item">${l}</div>`;
    }).join('') : '<div style="color:#a08873">本篇字词古雅，品读时注意体会语境。</div>');
    // 今译
    $('dp-tr').innerHTML = '<h4>白话今译</h4>' + (p.tr ? `<div style="line-height:2">${p.tr.replace(/\n/g,'<br>')}</div>` : '<div style="color:#a08873">今译参见名家译注。</div>');
    // 赏析
    $('dp-appr').innerHTML = '<h4>赏　析</h4>' + (p.appr ? `<div style="line-height:2">${p.appr.replace(/\n/g,'<br>')}</div>` : '<div style="color:#a08873">赏析整理中。</div>');
    // 起承转合
    $('dp-st').innerHTML = '<h4>起承转合</h4>' + (p.st ? `<div class="st-grid">${p.st.split('\n').map(l=>{
      const m = l.match(/^【(.+?)】(.*)$/);
      return m ? `<div class="st-block"><b>${m[1]}</b><span>${m[2]}</span></div>` : `<div>${l}</div>`;
    }).join('')}</div>` : '<div style="color:#a08873">章法分析整理中。</div>');
    // 意象
    $('dp-img').innerHTML = '<h4>诗中意象</h4>' + (p.img ? `<ul class="img-list">${p.img.split('\n').map(l=>{
      const m = l.match(/^【(.+?)】(.*)$/);
      return m ? `<li><b>${m[1]}</b>${m[2]}</li>` : `<li>${l}</li>`;
    }).join('')}</ul>` : '<div style="color:#a08873">意象解读整理中。</div>');
    // 背景
    $('dp-bg').innerHTML = '<h4>创作背景</h4>' + (p.bg ? `<div style="line-height:2">${p.bg.replace(/\n/g,'<br>')}</div>` : '<div style="color:#a08873">背景资料整理中。</div>');
    // 题旨
    $('dp-theme').innerHTML = '<h4>主　旨</h4>' + (p.theme ? `<div style="line-height:2">${p.theme}</div>` : '<div style="color:#a08873">题旨阐发整理中。</div>');
  }

  // 渲染翻页
  function renderPN(idx){
    let html = '';
    if(MODE==='anth'){
      const prev = POEMS[idx-1], next = POEMS[idx+1];
      if(prev) html += `<a href="view.html?s=${prev.slug}"><span>上一篇</span>${prev.title}</a>`;
      else html += `<div style="width:100px"></div>`;
      if(next) html += `<a href="view.html?s=${next.slug}" style="margin-left:auto"><span>下一篇</span>${next.title}</a>`;
      else html += `<div style="width:100px;margin-left:auto"></div>`;
    } else if(MODE==='deep'){
      const prev = idx>0?POEMS[idx-1]:null, next=idx<POEMS.length-1?POEMS[idx+1]:null;
      if(prev) html += `<a href="view.html?deep=${prev.slug}"><span>上一篇</span>${prev.title}</a>`;
      else html += `<div style="width:100px"></div>`;
      if(next) html += `<a href="view.html?deep=${next.slug}" style="margin-left:auto"><span>下一篇</span>${next.title}</a>`;
      else html += `<div style="width:100px;margin-left:auto"></div>`;
    } else {
      const prev = idx>0, next = idx<POEMS.length-1;
      if(prev) html += `<a href="view.html?src=${srcParam}&i=${iParam-1}"><span>上一篇</span>${POEMS[idx-1].title}</a>`;
      else html += `<div style="width:100px"></div>`;
      if(next) html += `<a href="view.html?src=${srcParam}&i=${iParam+1}" style="margin-left:auto"><span>下一篇</span>${POEMS[idx+1].title}</a>`;
      else html += `<div style="width:100px;margin-left:auto"></div>`;
    }
    $('pn').innerHTML = html;
  }

  // 加载深度名作（按分片懒加载，首屏仅加载目标分片+索引）
  const DEEP_SHARD_CACHE = {};
  async function loadDeepShard(sid){
    if(DEEP_SHARD_CACHE[sid]) return DEEP_SHARD_CACHE[sid];
    const r = await fetch('../shicang_data/jingdu/deep_shards/'+sid+'.json?_='+Date.now()).then(r=>r.json());
    DEEP_SHARD_CACHE[sid] = (r.works||[]).map(w => normalize(w, {title:'深度名作', dynasty:w.dynasty, genre:w.genre||'诗'}));
    return DEEP_SHARD_CACHE[sid];
  }
  async function loadDeep(){
    try{
      const chars = await fetch('../shicang_data/char_info.json').then(r=>r.json()).catch(()=>({}));
      CHAR = chars;
      // 加载索引
      const idx = await fetch('../shicang_data/jingdu/deep_index.json?_='+Date.now()).then(r=>r.json());
      const list = idx.works||[];
      // 找到目标所在分片
      let target = list.find(w => w.key === deepParam) || list[0];
      if(!target){ target = list[0]; }
      // 加载目标分片
      POEMS = await loadDeepShard(target.shard);
      CUR_IDX = POEMS.findIndex(w => w.slug === target.key);
      if(CUR_IDX < 0) CUR_IDX = 0;
      CUR = POEMS[CUR_IDX];
      // 预加载相邻分片（后台）
      const shardIds = (idx.shards||[]);
      const curShardIdx = shardIds.indexOf(target.shard);
      [curShardIdx-1, curShardIdx+1].forEach(i => {
        if(i>=0 && i<shardIds.length) loadDeepShard(shardIds[i]).catch(()=>{});
      });
    }catch(e){
      $('poem').innerHTML = `<div class="loading">加载失败：${e.message}</div>`;
      return;
    }
    renderAll();
  }

  // 加载选本
  async function loadAnth(){
    try{
      const [chars, data] = await Promise.all([
        fetch('../shicang_data/char_info.json').then(r=>r.json()).catch(()=>({})),
        fetch('../shicang_data/mingpian/data_'+aslug+'.json').then(r=>r.json())
      ]);
      CHAR = chars;
      POEMS = data.map(w => normalize(w, {title:ANTH_NAME[aslug]||aslug, dynasty:'', genre:w.genre||'诗'}));
      CUR_IDX = 0;
      if(slug){
        const i = POEMS.findIndex(p => p.slug === slug);
        if(i>=0) CUR_IDX = i;
      } else {
        CUR_IDX = Math.max(0, Math.min(iParam, POEMS.length-1));
      }
      CUR = POEMS[CUR_IDX];
    }catch(e){
      $('poem').innerHTML = `<div class="loading">加载失败：${e.message}</div>`;
      return;
    }
    renderAll();
  }

  // 加载全集
  async function loadColl(){
    try{
      const idx = await fetch('../shicang_data/jingdu_lib/'+srcParam+'_index.json').then(r=>r.json());
      const chars = await fetch('../shicang_data/char_info.json').then(r=>r.json()).catch(()=>({}));
      CHAR = chars;
      const vols = idx.volumes || [];
      // 找目标卷
      let targetVol = vols[0], volOffset = 0, idxInVol = iParam, countAcc = 0;
      for(const v of vols){
        const fp = typeof v === 'string' ? v : v.file;
        const cnt = typeof v === 'string' ? 1000 : (v.count||1000);
        if(iParam < countAcc + cnt){
          targetVol = v; volOffset = countAcc; idxInVol = iParam - countAcc; break;
        }
        countAcc += cnt;
      }
      const fp = typeof targetVol === 'string' ? targetVol : targetVol.file;
      const volData = await fetch('../shicang_data/jingdu_lib/'+fp).then(r=>r.json());
      const meta = {title: idx.title||srcParam, dynasty: idx.dynasty||'', genre: idx.genre||'诗'};
      POEMS = volData.map(w => normalize(w, meta));
      CUR_IDX = Math.max(0, Math.min(idxInVol, POEMS.length-1));
      CUR = POEMS[CUR_IDX];
    }catch(e){
      $('poem').innerHTML = `<div class="loading">加载失败：${e.message}</div>`;
      return;
    }
    renderAll();
  }

  function renderAll(){
    if(!CUR){ $('poem').innerHTML='<div class="loading">未 得 此 篇</div>'; return; }
    renderMeta(CUR);
    renderPoem(CUR);
    renderPanels(CUR);
    renderPN(CUR_IDX);
  }

  // 启动
  if(MODE==='deep') loadDeep();
  else if(MODE==='anth') loadAnth();
  else if(MODE==='coll') loadColl();
  else { $('poem').innerHTML='<div class="loading">未指定篇目</div>'; }
})();
</script>
<script src="../topnav.js"></script>
</body>
</html>
