// ============== 星空背景 ==============
(function initStars(){
  const cv = document.getElementById('starCanvas');
  const ctx = cv.getContext('2d');
  let W,H,stars=[],nebulae=[];
  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  function build(){
    stars = [];
    const n = Math.floor(W*H/4000);
    for(let i=0;i<n;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.6+0.3,
        a:Math.random()*Math.PI*2,
        sp:Math.random()*0.02+0.005,
        col:['#fff','#c4b5fd','#fbcfe8','#fde68a','#a5f3fc'][Math.floor(Math.random()*5)]
      });
    }
    nebulae=[];
    for(let i=0;i<5;i++){
      nebulae.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*260+200,
        col:['rgba(139,92,246,0.08)','rgba(236,72,153,0.07)','rgba(59,130,246,0.07)','rgba(244,114,182,0.06)','rgba(168,85,247,0.08)'][i],
        vx:(Math.random()-0.5)*0.15, vy:(Math.random()-0.5)*0.1
      });
    }
  }
  function draw(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a0a3e');
    g.addColorStop(0.5,'#0c0628');
    g.addColorStop(1,'#04020f');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // nebulae
    nebulae.forEach(n=>{
      const rg = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      rg.addColorStop(0,n.col); rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<-n.r) n.x=W+n.r; if(n.x>W+n.r)n.x=-n.r;
      if(n.y<-n.r) n.y=H+n.r; if(n.y>H+n.r)n.y=-n.r;
    });
    // stars
    stars.forEach(s=>{
      s.a+=s.sp;
      const alpha = (Math.sin(s.a)+1)/2*0.8+0.2;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=s.col;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();build();});
  resize();build();draw();
})();

// ============== 星河图数据准备 ==============
const poetMap = {};
POETS.forEach(p=>poetMap[p.id]=p);

// X 坐标：-1100 ~ 1912 -> marginLeft=80, width-160
const YEAR_MIN=-1100,YEAR_MAX=1912;
// Y 坐标：按朝代分 8 条基线
const DYN_Y = {};
DYNASTIES.forEach((d,i)=>{DYN_Y[d.id]=120+i*72;});

function computeLayout(){
  const svg = document.getElementById('galaxySvg');
  const w = svg.clientWidth, h = svg.clientHeight;
  const padL=80, padR=40, padT=40, padB=80;
  const gw=w-padL-padR, gh=h-padT-padB;
  POETS.forEach(p=>{
    const mid = (p.years[0]+p.years[1])/2;
    p._x = padL + (mid-YEAR_MIN)/(YEAR_MAX-YEAR_MIN)*gw;
    const base = DYN_Y[p.dynasty]*(gh/(120+(DYNASTIES.length-1)*72));
    // 使用固定随机数（seeded by id）
    let seed=0;for(let i=0;i<p.id.length;i++)seed=(seed*31+p.id.charCodeAt(i))%10000;
    const jitter=(seed/10000-0.5)*70;
    p._y = padT + base + jitter;
    // 半径
    p._r = p.title && (p.title.includes('圣')||p.title.includes('仙')||p.title.includes('龙')||p.title.includes('冠')||p.name==='苏轼'||p.name==='李白'||p.name==='杜甫'||p.name==='白居易'||p.name==='辛弃疾'||p.name==='李清照'||p.name==='陶渊明'||p.name==='屈原') ? 10 :
           (p.title && p.title.length>6 ? 8 : 6);
    p._r += 2; // 统一略大
  });
}
computeLayout();
window.addEventListener('resize',()=>{computeLayout();renderGalaxy();});

// ============== 筛选器 ==============
const state = {dyns:new Set(DYNASTIES.map(d=>d.id)), schools:new Set(SCHOOLS), zoom:1, panX:0, panY:0};

function buildFilters(){
  const dynBox = document.getElementById('dynFilter');
  DYNASTIES.forEach(d=>{
    const el=document.createElement('span');
    el.className='filter-chip on'; el.dataset.dyn=d.id;
    el.style.color=d.color;
    el.innerHTML=`<span class="dot" style="background:${d.color}"></span>${d.name}`;
    el.addEventListener('click',()=>{
      if(state.dyns.has(d.id)){state.dyns.delete(d.id);el.classList.remove('on');}
      else {state.dyns.add(d.id);el.classList.add('on');}
      renderGalaxy();
    });
    dynBox.appendChild(el);
  });
  const schBox = document.getElementById('schoolFilter');
  SCHOOLS.forEach(s=>{
    const el=document.createElement('span');
    el.className='filter-chip on'; el.dataset.sch=s;
    el.innerHTML=s;
    el.addEventListener('click',()=>{
      if(state.schools.has(s)){state.schools.delete(s);el.classList.remove('on');}
      else{state.schools.add(s);el.classList.add('on');}
      renderGalaxy();
    });
    schBox.appendChild(el);
  });
}
buildFilters();

// ============== 渲染星河 ==============
let flowT=0;
function renderGalaxy(){
  const svg = document.getElementById('galaxySvg');
  const w = svg.clientWidth, h = svg.clientHeight;
  const padL=80, padR=40, padT=40, padB=80;
  const gw=w-padL-padR;
  // 先构建显示集合
  const visible = POETS.filter(p=>state.dyns.has(p.dynasty) && (p.school==='' || state.schools.has(p.school)));
  const vid = new Set(visible.map(p=>p.id));

  // defs
  let defs = `<defs>`;
  DYNASTIES.forEach(d=>{
    defs+=`<filter id="glow_${d.id}" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;
  });
  defs+=`</defs>`;

  // 时间轴
  let axis=`<g class="axis">`;
  const axisY = h-padB+30;
  axis+=`<line x1="${padL}" y1="${axisY}" x2="${w-padR}" y2="${axisY}" stroke="rgba(196,181,253,0.3)" stroke-width="1"/>`;
  // 朝代色块
  DYNASTIES.forEach(d=>{
    const x1=padL + Math.max(0,(d.start-YEAR_MIN))/(YEAR_MAX-YEAR_MIN)*gw;
    const x2=padL + Math.min(gw,(d.end-YEAR_MIN))/(YEAR_MAX-YEAR_MIN)*gw;
    axis+=`<rect x="${x1}" y="${axisY+8}" width="${x2-x1}" height="14" fill="${d.color}" opacity="0.2" rx="3"/>`;
    axis+=`<text x="${(x1+x2)/2}" y="${axisY+20}" text-anchor="middle" fill="${d.color}" font-size="11">${d.name}</text>`;
  });
  // 关键年份刻度
  [-1000,-500,0,500,1000,1500,1900].forEach(y=>{
    const x = padL + (y-YEAR_MIN)/(YEAR_MAX-YEAR_MIN)*gw;
    const label = y<0?`前${-y}`:y;
    axis+=`<line x1="${x}" y1="${axisY-3}" x2="${x}" y2="${axisY+3}" stroke="rgba(196,181,253,0.4)"/>`;
    axis+=`<text x="${x}" y="${axisY-8}" text-anchor="middle" fill="rgba(196,181,253,0.7)" font-size="10">${label}</text>`;
  });
  axis+=`</g>`;

  // 连线
  const links=[];
  visible.forEach(p=>{
    (p.friends||[]).forEach(fid=>{
      if(!vid.has(fid)) return;
      if(p.id<fid) links.push([p,poetMap[fid]]);
    });
  });
  let linksSvg=`<g class="links">`;
  links.forEach(([a,b],i)=>{
    const col = DYNASTIES.find(d=>d.id===a.dynasty).color;
    linksSvg+=`<line x1="${a._x}" y1="${a._y}" x2="${b._x}" y2="${b._y}" stroke="${col}" stroke-opacity="0.18" stroke-width="1"/>`;
    // 流光点：沿线段移动
    const t = ((flowT*0.0004 + i*0.13)%1);
    const px = a._x + (b._x-a._x)*t;
    const py = a._y + (b._y-a._y)*t;
    linksSvg+=`<circle cx="${px}" cy="${py}" r="2" fill="${col}" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="${i*0.1}s"/>
    </circle>`;
  });
  linksSvg+=`</g>`;

  // 节点
  let nodesSvg=`<g class="nodes">`;
  visible.forEach(p=>{
    const d=DYNASTIES.find(dd=>dd.id===p.dynasty);
    nodesSvg+=`<g class="node" data-id="${p.id}" transform="translate(${p._x},${p._y})" style="cursor:pointer">
      <circle r="${p._r+6}" fill="${d.color}" opacity="0.15">
        <animate attributeName="r" values="${p._r+4};${p._r+10};${p._r+4}" dur="${2+(p._r%3)}s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.25;0.1" dur="${2+(p._r%3)}s" repeatCount="indefinite"/>
      </circle>
      <circle r="${p._r}" fill="${d.color}" filter="url(#glow_${d.id})" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
      <text y="${p._r+14}" text-anchor="middle" fill="${d.color}" font-size="10" opacity="0.85" style="pointer-events:none;text-shadow:0 0 4px ${d.color};">${p.name}</text>
    </g>`;
  });
  nodesSvg+=`</g>`;

  svg.innerHTML = `<g id="galaxyG" transform="translate(${state.panX},${state.panY}) scale(${state.zoom})">${defs}${linksSvg}${nodesSvg}${axis}</g>`;
  bindNodes();
}

function animateFlow(){
  flowT = performance.now();
  // 只更新流光点位置避免重绘全量——简单起见轻量重绘
  if(document.getElementById('galaxy-view').style.display!=='none'){
    // 为性能：节点呼吸动画已用SVG animate，仅节点位置不重算；更新流光可隔帧重绘，但会影响性能，改为setInterval低频
  }
  requestAnimationFrame(animateFlow);
}
setInterval(()=>{if(document.getElementById('galaxy-view').style.display!=='none')renderGalaxy();},80);
animateFlow();

// ============== 节点交互 ==============
const tooltip = document.getElementById('tooltip');
function bindNodes(){
  document.querySelectorAll('.node').forEach(g=>{
    g.addEventListener('mouseenter',e=>{
      const p = poetMap[g.dataset.id];
      const d = DYNASTIES.find(dd=>dd.id===p.dynasty);
      tooltip.innerHTML=`<div class="tt-name" style="color:${d.color}">${p.name}${p.title?' · '+p.title.split('·')[0]:''}</div>
        <div class="tt-sub">${d.name} · ${p.zi}</div>
        <div class="tt-sub" style="color:${d.color}">${p.birth} · 代表作《${p.works[0]}》</div>`;
      tooltip.style.display='block';
      g.querySelector('circle:nth-child(2)').setAttribute('r', p._r*1.5);
    });
    g.addEventListener('mousemove',e=>{
      tooltip.style.left=(e.clientX+14)+'px';
      tooltip.style.top=(e.clientY+14)+'px';
    });
    g.addEventListener('mouseleave',e=>{
      tooltip.style.display='none';
      const p=poetMap[g.dataset.id];
      g.querySelector('circle:nth-child(2)').setAttribute('r', p._r);
    });
    g.addEventListener('click',e=>{
      openDetail(g.dataset.id);
    });
  });
}

// ============== 缩放拖拽 ==============
const svgEl = document.getElementById('galaxySvg');
let dragging=false, lastX=0, lastY=0;
svgEl.addEventListener('mousedown',e=>{
  if(e.target.closest('.node'))return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  state.panX += e.clientX-lastX;
  state.panY += e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  renderGalaxy();
});
window.addEventListener('mouseup',()=>{dragging=false;});
svgEl.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  const mx = e.clientX-rect.left, my=e.clientY-rect.top;
  const delta = e.deltaY<0?1.1:0.9;
  const newZoom = Math.max(0.3, Math.min(4, state.zoom*delta));
  state.panX = mx - (mx-state.panX)*(newZoom/state.zoom);
  state.panY = my - (my-state.panY)*(newZoom/state.zoom);
  state.zoom=newZoom;
  renderGalaxy();
},{passive:false});

// ============== 详情面板 ==============
const panel = document.getElementById('detailPanel');
const detailBody = document.getElementById('detailBody');
document.getElementById('detailClose').addEventListener('click',()=>panel.classList.remove('open'));
function openDetail(id){
  const p=poetMap[id]; if(!p)return;
  const d=DYNASTIES.find(dd=>dd.id===p.dynasty);
  const lifeStr = (p.years[0]<0?`前${-p.years[0]}`:p.years[0])+' — '+(p.years[1]<0?`前${-p.years[1]}`:p.years[1]);
  let html=`<div class="dp-header">
    <div class="dp-avatar" style="background:${d.color}">${p.name[0]}</div>
    <div><div class="dp-name">${p.name}</div>
      <div class="dp-zihao">${p.zi}${p.title?' · '+p.title:''}</div>
      <div class="dp-meta">【${d.name}】${lifeStr} · 籍贯：${p.birth}${p.school?' · 流派：'+p.school:''}</div>
    </div></div>`;
  html+=`<div class="dp-section"><h4>诗人简介</h4><p>${p.intro}</p></div>`;
  html+=`<div class="dp-section"><h4>生平要事</h4><div class="dp-timeline">`;
  p.events.forEach(ev=>{
    const y = ev[0]<0?`前${-ev[0]}`:ev[0];
    html+=`<div class="ev"><span class="yr">${y}</span>${ev[1]}</div>`;
  });
  html+=`</div></div>`;
  html+=`<div class="dp-section"><h4>代表作品</h4><ul class="dp-works">`;
  p.works.forEach(w=>{html+=`<li>《${w}》</li>`;});
  html+=`</ul></div>`;
  if(p.friends && p.friends.length){
    html+=`<div class="dp-section"><h4>交游关系</h4><div>`;
    p.friends.forEach(fid=>{
      const fp=poetMap[fid];
      if(!fp)return;
      const fd=DYNASTIES.find(dd=>dd.id===fp.dynasty);
      html+=`<span class="dp-tag" style="border-color:${fd.color};color:${fd.color}" data-fid="${fid}">${fp.name}</span>`;
    });
    html+=`</div></div>`;
  }
  detailBody.innerHTML=html;
  panel.classList.add('open');
  detailBody.querySelectorAll('.dp-tag').forEach(t=>{
    t.addEventListener('click',()=>openDetail(t.dataset.fid));
  });
}

// ============== Tab 切换 ==============
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab=btn.dataset.tab;
    document.getElementById('galaxy-view').style.display = tab==='galaxy'?'block':'none';
    document.getElementById('timeline-view').style.display = tab==='timeline'?'flex':'none';
    if(tab==='galaxy') setTimeout(renderGalaxy,50);
  });
});

// ============== 单人轨迹视图 ==============
let curPoet = 'baijuyi';
function buildSidebar(){
  const sb=document.getElementById('tlSidebar');
  let html='';
  DYNASTIES.forEach(d=>{
    const list = POETS.filter(p=>p.dynasty===d.id);
    if(!list.length)return;
    html+=`<div class="tl-dyn-group"><div class="tl-dyn-title" style="color:${d.color}">${d.name}</div>`;
    list.forEach(p=>{
      const lifeStr = (p.years[0]<0?`前${-p.years[0]}`:p.years[0])+'-'+(p.years[1]<0?`前${-p.years[1]}`:p.years[1]);
      html+=`<div class="tl-poet-item" data-id="${p.id}" style="border-left-color:${p.id===curPoet?d.color:'transparent'}"><span style="color:${d.color}">${p.name}</span><span class="pi-life">${lifeStr}</span></div>`;
    });
    html+=`</div>`;
  });
  sb.innerHTML=html;
  sb.querySelectorAll('.tl-poet-item').forEach(el=>{
    el.addEventListener('click',()=>{
      curPoet=el.dataset.id;
      buildSidebar();
      renderTimeline();
    });
  });
}

function renderTimeline(){
  const p=poetMap[curPoet]; if(!p)return;
  const d=DYNASTIES.find(dd=>dd.id===p.dynasty);
  const lifeStr = (p.years[0]<0?`前${-p.years[0]}`:p.years[0])+' — '+(p.years[1]<0?`前${-p.years[1]}`:p.years[1]);
  const tc=document.getElementById('tlContent');

  // 简化中国轮廓SVG
  const mapSvg=`<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
    <path d="M80,80 Q100,50 140,45 Q180,40 220,50 Q280,45 330,60 Q380,70 420,90 Q440,110 430,140 Q420,170 380,180 Q340,190 300,185 Q260,190 220,180 Q180,185 140,170 Q100,155 80,130 Q70,105 80,80 Z" fill="#e8d7b8" stroke="#b9a27b" stroke-width="1.5"/>
    <circle cx="240" cy="110" r="4" fill="#8b5cf6"><title>长安</title></circle>
    <circle cx="300" cy="130" r="4" fill="#ef4444"><title>洛阳</title></circle>
    <circle cx="330" cy="150" r="4" fill="#f59e0b"><title>江南</title></circle>
    <text x="240" y="105" font-size="10" fill="#6b5a3f" text-anchor="middle">${p.birth.split(/[、，\/]/)[0]||'籍贯'}</text>
  </svg>`;

  let html=`<div class="tlc-head">
    <div class="tlc-avatar" style="background:${d.color}">${p.name[0]}</div>
    <div><div class="tlc-name">${p.name}</div>
      <div class="tlc-sub">${p.zi}${p.title?' · '+p.title:''}</div>
      <div class="tlc-sub">【${d.name}】${lifeStr} · 籍贯：${p.birth}${p.school?' · 流派：'+p.school:''}</div>
    </div></div>`;
  html+=`<div class="tlc-intro">${p.intro}</div>`;
  html+=`<div class="tlc-block"><h3>行迹图</h3><div class="tlc-map">${mapSvg}</div></div>`;
  html+=`<div class="tlc-block"><h3>生平年表</h3><div class="tlc-events">`;
  p.events.forEach(ev=>{
    const y=ev[0]<0?`前${-ev[0]}`:ev[0];
    html+=`<div class="ev"><span class="yr">${y}年</span>${ev[1]}</div>`;
  });
  html+=`</div></div>`;
  html+=`<div class="tlc-block"><h3>代表作品</h3><div class="tlc-works">`;
  p.works.forEach(w=>{
    html+=`<div class="tlc-work"><div class="wk-title" style="color:${d.color}">《${w}》</div><div style="color:#8b7355;font-size:12px">传世名篇</div></div>`;
  });
  html+=`</div></div>`;
  if(p.friends && p.friends.length){
    html+=`<div class="tlc-block"><h3>交游师友</h3><div>`;
    p.friends.forEach(fid=>{
      const fp=poetMap[fid]; if(!fp)return;
      const fd=DYNASTIES.find(dd=>dd.id===fp.dynasty);
      html+=`<span class="dp-tag" style="border-color:${fd.color};color:${fd.color}" data-fid="${fid}">${fp.name}</span>`;
    });
    html+=`</div></div>`;
  }
  tc.innerHTML=html;
  tc.scrollTop=0;
  tc.querySelectorAll('.dp-tag').forEach(t=>{
    t.addEventListener('click',()=>{
      curPoet=t.dataset.fid;
      buildSidebar();
      renderTimeline();
    });
  });
}
buildSidebar();
renderTimeline();

// 初始渲染
renderGalaxy();
</script>

<div class="colophon">诗藏本体论 · 岁在丙午 · 辑于西泠</div>
<script>
window.addEventListener('scroll', ()=>{
  const btn = document.getElementById('backToTop');
  if(btn) btn.classList.toggle('show', window.scrollY>300);
});
document.addEventListener('click', (e)=>{
  if(e.target.id === 'backToTop') window.scrollTo({top:0,behavior:'smooth'});
});
let petalsOn = localStorage.getItem('petals')==='true';
let petalTimer = null;
function togglePetals(){
  petalsOn = !petalsOn;
  localStorage.setItem('petals', petalsOn);
  petalsOn ? startPetals() : stopPetals();
}
function startPetals(){
  if(petalTimer) return;
  petalTimer = setInterval(()=>{
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (7 + Math.random()*7) + 's';
    const s = 6 + Math.random()*8;
    p.style.width = p.style.height = s + 'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 15000);
  }, 700);
}
function stopPetals(){
  clearInterval(petalTimer);
  petalTimer = null;
}
if(petalsOn) startPetals();
// 夜读模式兼容
document.querySelectorAll('.night-btn, [onclick*="night"]').forEach(btn=>{
  btn.addEventListener('click', ()=>document.body.classList.toggle('night'));
});
// 卷轴入场
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelector('.container, .main, .content')?.classList.add('scroll-unfold');
});
